  body { font-family: 'IBM Plex Sans', sans-serif; }

  ::-webkit-scrollbar { display: none; }

  /* ---- Animations ---- */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .fade-up { animation: fadeUp .55s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
  .sheet { animation: sheetUp .4s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
  .backdrop { animation: backdropIn .25s ease both; }
  @keyframes twinkle { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
  @keyframes drift { from { transform: translateX(-40vw); } to { transform: translateX(120vw); } }
  @keyframes stampIn { 0% { opacity: 0; transform: rotate(-14deg) scale(2.4); } 60% { opacity: 1; transform: rotate(-14deg) scale(.9); } 100% { opacity: .9; transform: rotate(-14deg) scale(1); } }
  .stamp { animation: stampIn .45s cubic-bezier(.3,1.4,.5,1) both; }
  @keyframes glide { 0% { left: 0; opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { left: calc(100% - 16px); opacity: 0; } }
  .glide { animation: glide 3.4s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .bob { animation: bob 2.4s ease-in-out infinite; }
  @keyframes dash { to { stroke-dashoffset: 22; } }
  .dash-move { animation: dash .7s linear infinite; }
  @keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .pop { animation: pop .35s cubic-bezier(.3,1.5,.5,1) both; }
  @keyframes captionIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .caption-in { animation: captionIn .5s ease both; }
  @keyframes confetti { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }
  @keyframes spinSlow { to { transform: rotate(360deg); } }
  .spin-slow { animation: spinSlow 10s linear infinite; }
  .press { transition: transform .12s ease; }
  .press:active { transform: scale(.96); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
  }

const PALETTE = [GOLD, SAGE, "#CE7A52", "#9868A8", BLUE, "#3F8F8F", ROSE, "#D18242", ROSE_PALE, "#9C8A8D"];
function colorFor(str) {
  if (!str) return TEXT_MUTED;
  let hash = 0;
  for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
  return PALETTE[hash % PALETTE.length];
}

const uid = () => Math.random().toString(36).slice(2, 10);
function todayISO() { return new Date().toISOString().slice(0, 10); }
function formatDate(d) { if (!d) return ""; return new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }); }
function formatShort(d) { if (!d) return ""; return new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "short" }); }
function parseCountries(str) { return (str || "").split(",").map((s) => s.trim()).filter(Boolean); }
function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
function tripStatus(trip) {
  const today = todayISO();
  if (trip.start_date && today < trip.start_date) return { label: "À venir", color: ROSE };
  if (trip.end_date && today > trip.end_date) return { label: "Terminé", color: SAGE };
  if (trip.start_date || trip.end_date) return { label: "En cours", color: GOLD };
  return { label: "Sans dates", color: TEXT_MUTED };
}
function countdown(trip) {
  const today = todayISO();
  if (trip.start_date && today < trip.start_date) {
    const n = daysBetween(today, trip.start_date);
    return { big: `J-${n}`, small: n === 1 ? "demain !" : "avant le départ" };
  }
  if (trip.start_date && (!trip.end_date || today <= trip.end_date)) return { big: `J${daysBetween(trip.start_date, today) + 1}`, small: "en voyage" };
  if (trip.end_date && today > trip.end_date) return { big: "✓", small: "souvenirs" };
  return { big: "?", small: "à dater" };
}
// Code "aéroport" façon carte d'embarquement : Dubrovnik -> DUB
function code3(s) { return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z]/g, "").slice(0, 3).toUpperCase() || "···"; }

/* ---------- Avion (même silhouette que l'icône de l'app) ---------- */

const PLANE_RIGHT = [[0, -0.5], [0.045, -0.46], [0.062, -0.38], [0.062, -0.12], [0.46, 0.09], [0.47, 0.17], [0.062, 0.05], [0.05, 0.31], [0.19, 0.4], [0.19, 0.46], [0, 0.41]];
const PLANE = [...PLANE_RIGHT, ...PLANE_RIGHT.slice(1, -1).reverse().map(([x, y]) => [-x, y])];
const PLANE_POLY = PLANE.map((p) => p.join(",")).join(" ");

function PlaneIcon({ size = 16, color = "#FFFFFF", rotate = 90, style = {} }) {
  return (
    <svg width={size} height={size} viewBox="-0.55 -0.55 1.1 1.1" style={{ transform: `rotate(${rotate}deg)`, display: "block", ...style }}>

}

/* ---------- Géocodage (OpenStreetMap / Nominatim, mis en cache sur l'appareil) ---------- */

const GEO_LS = "rt-geo-v2";
const geoCache = (() => { try { return JSON.parse(localStorage.getItem(GEO_LS) || "{}"); } catch (e) { return {}; } })();
const geoPending = {};
let geoChain = Promise.resolve();
const geoKey = (q) => q.trim().toLowerCase();

function geocode(q) {
  const k = geoKey(q);
  if (k in geoCache) return Promise.resolve(geoCache[k]);
  if (geoPending[k]) return geoPending[k];
  // Une requête à la fois, espacées d'1 s (règle d'usage de Nominatim)
  geoPending[k] = geoChain = geoChain.then(() =>
    fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=1&accept-language=fr&q=${encodeURIComponent(q)}`)
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then((j) => {
        const a = (j && j[0] && j[0].address) || {};
        geoCache[k] = j && j[0] ? { lat: +j[0].lat, lon: +j[0].lon, cc: (a.country_code || "").toUpperCase(), country: a.country || "" } : null;
        try { localStorage.setItem(GEO_LS, JSON.stringify(geoCache)); } catch (e) {}
        return geoCache[k];
      })
      .catch(() => null)
      .then((v) => new Promise((res) => setTimeout(() => res(v), 1100)))
  );
  return geoPending[k];
}

// items : [{ q, label, sub, done }] -> points avec lat/lon (ceux déjà trouvés)
function useGeoPoints(items) {
  const seen = new Set();
  const uniq = items.filter((i) => i.q && !seen.has(geoKey(i.q)) && seen.add(geoKey(i.q)));
  const key = uniq.map((i) => i.q + (i.done ? "✓" : "")).join("|");
  const [tick, setTick] = useState(0);
  useEffect(() => {
    let alive = true;
    uniq.forEach((i) => { if (!(geoKey(i.q) in geoCache)) geocode(i.q).then(() => alive && setTick((t) => t + 1)); });
    return () => { alive = false; };
  }, [key]);
  return useMemo(() => uniq.map((i) => { const c = geoCache[geoKey(i.q)]; return c ? { ...i, ...c } : null; }).filter(Boolean), [key, tick]);
}

/* ---------- Globe animé avec l'avion ---------- */

const DEMO = [
  { label: "Marrakech", sub: "Maroc", lat: 31.63, lon: -7.99 },
  { label: "Reykjavik", sub: "Islande", lat: 64.15, lon: -21.94 },
  { label: "New York", sub: "États-Unis", lat: 40.71, lon: -74.0 },
  { label: "Rio de Janeiro", sub: "Brésil", lat: -22.9, lon: -43.2 },
  { label: "Le Cap", sub: "Afrique du Sud", lat: -33.92, lon: 18.42 },
  { label: "Bali", sub: "Indonésie", lat: -8.4, lon: 115.19 },
  { label: "Kyoto", sub: "Japon", lat: 35.01, lon: 135.77 },
  { label: "Santorin", sub: "Grèce", lat: 36.39, lon: 25.46 },
].map((d) => ({ ...d, demo: true }));

let worldPromise = null;
function loadWorld() {
  if (!worldPromise) {
    worldPromise = fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
      .then((r) => r.json())
      .then((topo) => ({
        land: topojson.feature(topo, topo.objects.land),
        borders: topojson.mesh(topo, topo.objects.countries, (a, b) => a !== b),
        countries: topojson.feature(topo, topo.objects.countries).features,
      }))
      .catch(() => null);
  }
  return worldPromise;
}

const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const HOLD = 1200; // pause à l'atterrissage (ms)

function Globe({ points, mode = "tour", height = 240, resetKey = "", onLeg }) {
  const wrapRef = useRef(null);
  const canvasRef = useRef(null);
  const ptsRef = useRef(points); ptsRef.current = points;
  const onLegRef = useRef(onLeg); onLegRef.current = onLeg;
  const resetRef = useRef(resetKey); resetRef.current = resetKey;
  const [world, setWorld] = useState(null);

  useEffect(() => { let alive = true; loadWorld().then((w) => alive && setWorld(w)); return () => { alive = false; }; }, []);

  useEffect(() => {
    const canvas = canvasRef.current, wrap = wrapRef.current;
    if (!canvas || !wrap || !window.d3) return;
    const ctx = canvas.getContext("2d");
    const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const proj = d3.geoOrthographic().clipAngle(90);
    const path = d3.geoPath(proj, ctx);
    const grat = d3.geoGraticule10();
    let w = 0, dpr = 1, raf = 0, dead = false, visible = true;
    let rot = null, leg = null, lastReset = resetRef.current;

    const list = () => {
      // Itinéraire : uniquement les vraies étapes (jamais d'exemples)
      if (mode === "route") return ptsRef.current || [];
      const p = ptsRef.current && ptsRef.current.length ? ptsRef.current : DEMO;
      // Une seule destination : l'avion y va, puis propose des idées d'ailleurs
      return p.length === 1 ? [p[0], ...DEMO] : p;
    };
    const makeLeg = (from, to, idx, now, total) => {
      const dist = d3.geoDistance([from.lon, from.lat], [to.lon, to.lat]);
      leg = {
        from, to, idx, start: now,
        dur: 1500 + dist * 2600,
        alt: Math.min(0.2, 0.04 + dist * 0.09),
        interp: d3.geoInterpolate([from.lon, from.lat], [to.lon, to.lat]),
      };
      onLegRef.current && onLegRef.current({ from, to, index: idx, total });
    };
    const nextLeg = (now) => {
      const l = list();
      if (!leg) return makeLeg(l[0], l[1 % l.length], 1 % l.length, now, l.length);
      let idx = (leg.idx + 1) % l.length;
      if (l[idx].lat === leg.to.lat && l[idx].lon === leg.to.lon) idx = (idx + 1) % l.length;
      makeLeg(leg.to, l[idx], idx, now, l.length);
    };

    const draw = (now) => {
      const H = height, W = w;
      if (!W) return;
      if (resetRef.current !== lastReset) { lastReset = resetRef.current; leg = null; }
      const l = list();
      // Moins de 2 lieux : pas de vol, le globe tourne doucement (ou se pose sur l'unique étape)
      const idle = l.length < 2;
      let e = 0, pos = null, target;
      if (idle) {
        leg = null;
        target = l.length ? [-l[0].lon, -l[0].lat * 0.8] : [(rot ? rot[0] : 0) + 0.15, -25];
      } else {
        if (!leg) nextLeg(now);
        let t = (now - leg.start) / leg.dur;
        if (t > 1 + HOLD / leg.dur) { nextLeg(now); t = 0; }
        if (reduced) t = 0.5;
        e = ease(Math.min(1, Math.max(0, t)));
        pos = leg.interp(e);
        // Le globe suit l'avion en douceur
        target = [-pos[0], -pos[1] * 0.8];
      }
      if (!rot || reduced) rot = target.slice();
      else {
        const dl = ((target[0] - rot[0] + 540) % 360) - 180;
        rot[0] += dl * 0.06;
        rot[1] += (target[1] - rot[1]) * 0.06;
      }

      const cx = W / 2, cy = H / 2, r = Math.min(W, H) / 2 * 0.8;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      proj.scale(r).translate([cx, cy]).rotate(rot);
      const center = [-rot[0], -rot[1]];
      const P = (ll, alt) => {
        const p = proj(ll);
        const sx = cx + (p[0] - cx) * (1 + alt), sy = cy + (p[1] - cy) * (1 + alt);
        const front = d3.geoDistance(ll, center) < Math.PI / 2;
        return [sx, sy, front || (alt > 0 && Math.hypot(sx - cx, sy - cy) > r)];
      };

      // Halo atmosphérique
      let g = ctx.createRadialGradient(cx, cy, r * 0.92, cx, cy, r * 1.32);
      g.addColorStop(0, "rgba(255,185,210,0.5)"); g.addColorStop(1, "rgba(255,185,210,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r * 1.32, 0, Math.PI * 2); ctx.fill();
      // Océan
      g = ctx.createRadialGradient(cx - r * 0.4, cy - r * 0.4, r * 0.1, cx, cy, r * 1.05);
      g.addColorStop(0, "#5D4A8A"); g.addColorStop(1, "#1F1734");
      ctx.fillStyle = g; ctx.beginPath(); path({ type: "Sphere" }); ctx.fill();
      ctx.beginPath(); path(grat); ctx.strokeStyle = "rgba(255,255,255,0.08)"; ctx.lineWidth = 0.6; ctx.stroke();
      // Continents
      if (world) {
        ctx.beginPath(); path(world.land); ctx.fillStyle = "#F4B3C4"; ctx.fill();
        ctx.beginPath(); path(world.borders); ctx.strokeStyle = "rgba(130,55,95,0.35)"; ctx.lineWidth = 0.5; ctx.stroke();
      }
      // Ombre / lumière
      g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.45, r * 0.05, cx, cy, r);
      g.addColorStop(0, "rgba(255,255,255,0.22)"); g.addColorStop(0.5, "rgba(255,255,255,0)"); g.addColorStop(1, "rgba(25,10,45,0.5)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();

      const arc = (ip, alt, upto) => {
        ctx.beginPath();
        let pen = false;
        for (let i = 0; i <= 48; i++) {
          const s = (i / 48) * upto;
          const q = P(ip(s), Math.sin(Math.PI * s) * alt);
          if (q[2]) { pen ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); pen = true; } else pen = false;
        }
        ctx.stroke();
      };

      // Itinéraire complet (mode road trip)
      if (mode === "route" && l.length > 1) {
        ctx.setLineDash([2, 4]); ctx.lineWidth = 1.2; ctx.strokeStyle = "rgba(255,255,255,0.35)";
        for (let i = 0; i < l.length - 1; i++) {
          const a = l[i], b = l[i + 1];
          const dist = d3.geoDistance([a.lon, a.lat], [b.lon, b.lat]);
          arc(d3.geoInterpolate([a.lon, a.lat], [b.lon, b.lat]), Math.min(0.2, 0.04 + dist * 0.09), 1);
        }
        ctx.setLineDash([]);
      }

      // Épingles
      l.forEach((p) => {
        const ll = [p.lon, p.lat];
        if (d3.geoDistance(ll, center) > Math.PI / 2 * 0.97) return;
        const [x, y] = proj(ll);
        const isDest = leg ? p === leg.to : l.length === 1;
        if (isDest) {
          const k = ((now / 1000) % 1.4) / 1.4;
          ctx.beginPath(); ctx.arc(x, y, 4 + k * 14, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255,214,140,${1 - k})`; ctx.lineWidth = 1.5; ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(x, y, isDest ? 4.2 : 3, 0, Math.PI * 2);
        ctx.fillStyle = p.done ? "#9FE3B4" : "#FFD68C"; ctx.fill();
        ctx.lineWidth = 1.2; ctx.strokeStyle = "#FFFFFF"; ctx.stroke();
        if (isDest && p.label) {
          ctx.font = "600 11px 'IBM Plex Sans', sans-serif";
          ctx.fillStyle = "#FFFFFF"; ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = 4;
          ctx.fillText(p.label, x + 8, y - 6);
          ctx.shadowBlur = 0;
        }
      });

      if (idle) return;
      // Traînée de l'avion
      ctx.setLineDash([4, 5]); ctx.lineDashOffset = reduced ? 0 : -now / 40;
      ctx.lineWidth = 1.6; ctx.strokeStyle = "rgba(255,255,255,0.9)";
      arc(leg.interp, leg.alt, e);
      ctx.setLineDash([]);

      // L'avion (+ son ombre sur le globe)
      const altNow = Math.sin(Math.PI * e) * leg.alt;
      const q = P(pos, altNow);
      const e0 = Math.max(0, e - 0.01), e1 = Math.min(1, e0 + 0.01);
      const qa = P(leg.interp(e0), Math.sin(Math.PI * e0) * leg.alt), qb = P(leg.interp(e1), Math.sin(Math.PI * e1) * leg.alt);
      const angle = Math.atan2(qb[1] - qa[1], qb[0] - qa[0]) + Math.PI / 2;
      const size = r * 0.17 * (1 + altNow * 1.6);
      const drawPlane = (x, y, s, fill) => {
        ctx.save(); ctx.translate(x, y); ctx.rotate(angle); ctx.scale(s, s);
        ctx.beginPath(); PLANE.forEach(([px, py], i) => (i ? ctx.lineTo(px, py) : ctx.moveTo(px, py))); ctx.closePath();
        ctx.fillStyle = fill; ctx.fill(); ctx.restore();
      };
      if (q[2]) {
        const base = proj(pos);
        drawPlane(base[0], base[1], size * 0.8, "rgba(20,8,35,0.35)");
        ctx.shadowColor = "rgba(255,255,255,0.7)"; ctx.shadowBlur = 10;
        drawPlane(q[0], q[1], size, "#FFFFFF");
        ctx.shadowBlur = 0;
      }
    };

    const resize = () => {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = wrap.clientWidth;
      canvas.width = w * dpr; canvas.height = height * dpr;
      canvas.style.width = w + "px"; canvas.style.height = height + "px";
      if (reduced) draw(performance.now());
    };
    const frame = (now) => {
      if (dead) return;
      if (visible) draw(now);
      if (!reduced) raf = requestAnimationFrame(frame);
    };
    const ro = new ResizeObserver(resize);
    ro.observe(wrap);
    const io = new IntersectionObserver(([en]) => { visible = en.isIntersecting; });
    io.observe(wrap);
    resize();
    raf = requestAnimationFrame(frame);
    return () => { dead = true; cancelAnimationFrame(raf); ro.disconnect(); io.disconnect(); };
  }, [height, world, mode]);

  return <div ref={wrapRef} style={{ width: "100%", height }}><canvas ref={canvasRef} /></div>;
}

/* ---------- Décor : étoiles, nuages, ciel ---------- */

function Stars({ count = 40, maxY = 75 }) {
  const stars = useMemo(() => Array.from({ length: count }, () => ({
    x: Math.random() * 100, y: Math.random() * maxY, s: Math.random() * 1.8 + 0.6, d: Math.random() * 4,
  })), [count, maxY]);
  return stars.map((s, i) => (
    <span key={i} style={{ position: "absolute", left: s.x + "%", top: s.y + "%", width: s.s, height: s.s, borderRadius: 9, background: "#FFFFFF", animation: `twinkle ${2.5 + s.d}s ease-in-out ${s.d}s infinite`, pointerEvents: "none" }} />
  ));
}

function Clouds() {

const CONTINENTS = {
  "Europe": "AD AL AT AX BA BE BG BY CH CY CZ DE DK EE ES FI FO FR GB GG GI GR HR HU IE IM IS IT JE LI LT LU LV MC MD ME MK MT NL NO PL PT RO RS RU SE SI SJ SK SM UA VA XK",
  "Asie": "AE AF AM AZ BD BH BN BT CN GE HK ID IL IN IQ IR JO JP KG KH KP KR KW KZ LA LB LK MM MN MO MV MY NP OM PH PK PS QA SA SG SY TH TJ TL TM TR TW UZ VN YE",
  "Afrique": "AO BF BI BJ BW CD CF CG CI CM CV DJ DZ EG EH ER ET GA GH GM GN GQ GW KE KM LR LS LY MA MG ML MR MU MW MZ NA NE NG RE RW SC SD SH SL SN SO SS ST SZ TD TG TN TZ UG YT ZA ZM ZW",
  "Amérique du Nord": "AG AI AW BB BL BM BQ BS BZ CA CR CU CW DM DO GD GL GP GT HN HT JM KN KY LC MF MQ MS MX NI PA PM PR SV SX TC TT US VC VG VI",
  "Amérique du Sud": "AR BO BR CL CO EC FK GF GY PE PY SR UY VE",
  "Océanie": "AS AU CK FJ FM GU KI MH MP NC NF NR NU NZ PF PG PN PW SB TK TO TV UM VU WF WS",
};
const CC_CONTINENT = {};
Object.entries(CONTINENTS).forEach(([k, v]) => v.split(" ").forEach((c) => (CC_CONTINENT[c] = k)));
const CONTINENT_EMOJI = { "Europe": "🏰", "Asie": "🏯", "Afrique": "🦒", "Amérique du Nord": "🗽", "Amérique du Sud": "🦜", "Océanie": "🐨" };
const WORLD_COUNTRIES = 195;

const STATUS = {
  visite: { label: "Visité", color: SAGE, rank: 4 },
  en_cours: { label: "En cours", color: GOLD, rank: 3 },
  prevu: { label: "Prévu", color: ROSE, rank: 2 },
  reve: { label: "Rêvé", color: "#9868A8", rank: 1 },
};
function tripPlaceStatus(t) {
  const l = tripStatus(t).label;
  return l === "Terminé" ? "visite" : l === "En cours" ? "en_cours" : "prevu";
}
// Tous les lieux de l'app, le statut le plus "fort" en premier (visité > en cours > prévu > rêvé)
function allPlaces(bucket, trips, journal) {
  const out = [];
  bucket.forEach((i) => out.push({ q: [i.place, i.country].filter(Boolean).join(", "), label: i.place, sub: i.country, status: i.status === "visite" ? "visite" : "reve" }));
  trips.forEach((t) => {
    const st = tripPlaceStatus(t);
    const stops = t.stops || [];
    (stops.length ? stops.map((s) => s.name) : parseCountries(t.countries)).forEach((n) => out.push({ q: n, label: n, sub: t.title, status: st }));
  });
  journal.forEach((j) => { if (j.place || j.country) out.push({ q: [j.place, j.country].filter(Boolean).join(", "), label: j.place || j.country, sub: j.country, status: "visite" }); });
  return out.filter((i) => i.q).map((i) => ({ ...i, done: i.status === "visite" })).sort((a, b) => STATUS[b.status].rank - STATUS[a.status].rank);
}
const geoOf = (q) => (q ? geoCache[geoKey(q)] : null);
function distKm(a, b) { return Math.round(d3.geoDistance([a.lon, a.lat], [b.lon, b.lat]) * 6371); }
function tripKm(trip) {
  let total = 0;
  const stops = trip.stops || [];
  for (let i = 1; i < stops.length; i++) {
    const a = geoOf(stops[i - 1].name), b = geoOf(stops[i].name);
    if (a && b) total += distKm(a, b);
  }
  return total;
}
const eur = (n) => new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(n || 0);
const fmtNum = (n) => new Intl.NumberFormat("fr-FR").format(n || 0);
function relTime(d) {
  const n = daysBetween(d, todayISO());
  if (n < 1) return "aujourd'hui";
  if (n < 31) return `il y a ${n} jour${n > 1 ? "s" : ""}`;
  if (n < 365) return `il y a ${Math.round(n / 30.4)} mois`;
  const y = Math.round(n / 365);
  return `il y a ${y} an${y > 1 ? "s" : ""}`;
}
function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function dbError(msg) {
  return /column|schema cache/i.test(msg || "") ? `${msg} — Lance le fichier supabase-update-v2.sql dans Supabase (SQL Editor), puis réessaie.` : msg;
}
function useCountUp(value, dur = 1000) {
  const [v, setV] = useState(0);
  useEffect(() => {
    let raf, start;
    const step = (now) => {
      if (!start) start = now;
      const k = Math.min(1, (now - start) / dur);
      setV(Math.round(value * (1 - Math.pow(1 - k, 3))));
      if (k < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [value]);
  return v;
}

/* ---------- App principale ---------- */

function App({ session }) {
  const [bucket, setBucket] = useState([]);
  const [trips, setTrips] = useState([]);
  const [journal, setJournal] = useState([]);
  const [ready, setReady] = useState(false);
  const [tab, setTab] = useState("bucket");
  const [openTripId, setOpenTripId] = useState(null);
  const [bucketEditor, setBucketEditor] = useState(null);
  const [tripEditor, setTripEditor] = useState(null);
  const [journalEditor, setJournalEditor] = useState(null);
  const [wheelOpen, setWheelOpen] = useState(false);
  const [error, setError] = useState("");
  const fail = (err) => { if (err) setError(dbError(err.message)); };

  const fetchAll = async () => {
    const [b, t, j] = await Promise.all([
      sb.from("bucket_list").select("*").eq("user_id", session.user.id).order("created_at", { ascending: false }),
      sb.from("trips").select("*").eq("user_id", session.user.id).order("start_date", { ascending: true, nullsFirst: false }),
      sb.from("journal_entries").select("*").eq("user_id", session.user.id).order("entry_date", { ascending: false, nullsFirst: false }),
    ]);
    if (!b.error) setBucket(b.data || []);
    if (!t.error) setTrips(t.data || []);
    if (!j.error) setJournal(j.data || []);
    setReady(true);
  };
  useEffect(() => { fetchAll(); }, [session.user.id]);
  const logout = () => sb.auth.signOut();

  // ---- bucket list ----
  const saveBucket = async (item) => {
    setError("");
    const { error } = item.id
      ? await sb.from("bucket_list").update(item).eq("id", item.id)
      : await sb.from("bucket_list").insert({ ...item, user_id: session.user.id });
    fail(error);
    setBucketEditor(null); fetchAll();
  };
  const deleteBucket = async (id) => { const { error } = await sb.from("bucket_list").delete().eq("id", id); fail(error); fetchAll(); };
  const toggleBucketStatus = async (item) => {
    const status = item.status === "visite" ? "a_visiter" : "visite";
    setBucket((bs) => bs.map((b) => (b.id === item.id ? { ...b, status } : b)));
    const { error } = await sb.from("bucket_list").update({ status }).eq("id", item.id);
    fail(error); fetchAll();
  };

  // ---- trips ----
  const saveTrip = async (trip) => {
    setError("");
    const payload = { ...trip, updated_at: new Date().toISOString() };
    const { error } = trip.id
      ? await sb.from("trips").update(payload).eq("id", trip.id)
      : await sb.from("trips").insert({ ...payload, user_id: session.user.id, stops: [] });
    fail(error);
    setTripEditor(null); fetchAll();
  };
  const deleteTrip = async (id) => { const { error } = await sb.from("trips").delete().eq("id", id); fail(error); setOpenTripId(null); fetchAll(); };
  // Mise à jour partielle d'un voyage (étapes, checklist, dépenses) — affichée tout de suite
  const patchTrip = async (tripId, fields) => {
    setError("");
    setTrips((ts) => ts.map((t) => (t.id === tripId ? { ...t, ...fields } : t)));
    const { error } = await sb.from("trips").update({ ...fields, updated_at: new Date().toISOString() }).eq("id", tripId);
    fail(error); fetchAll();
  };

  // ---- journal ----
  const saveJournal = async (entry) => {
    setError("");
    const { error } = entry.id
      ? await sb.from("journal_entries").update(entry).eq("id", entry.id)
      : await sb.from("journal_entries").insert({ ...entry, user_id: session.user.id });
    fail(error);
    setJournalEditor(null); fetchAll();
  };
  const deleteJournal = async (id) => { const { error } = await sb.from("journal_entries").delete().eq("id", id); fail(error); fetchAll(); };

  const openTrip = trips.find((t) => t.id === openTripId) || null;
  const errorBanner = error && (
    <div className="mx-5 mt-4 text-xs px-3 py-2 rounded flex items-start gap-2" style={{ backgroundColor: DANGER + "1A", border: `1px solid ${DANGER}`, color: TEXT }}>
      <span className="flex-1">{error}</span>
      <button onClick={() => setError("")} style={{ color: TEXT_MUTED }}>✕</button>
    </div>
  );

  if (!ready) return <Boarding text="Embarquement…" />;

  if (openTrip) {
    return (
      <TripDetail
        trip={openTrip}
        journal={journal.filter((j) => j.trip_id === openTrip.id)}
        errorBanner={errorBanner}
        onBack={() => setOpenTripId(null)}
        onPatch={(fields) => patchTrip(openTrip.id, fields)}
        onEditTrip={() => setTripEditor(openTrip)}
        onDeleteTrip={() => deleteTrip(openTrip.id)}
        onAddJournal={() => setJournalEditor({ trip_id: openTrip.id })}
      >
        {tripEditor && <TripForm initial={typeof tripEditor === "object" ? tripEditor : null} onClose={() => setTripEditor(null)} onSubmit={saveTrip} />}
        {journalEditor && <JournalForm initial={typeof journalEditor === "object" ? journalEditor : null} trips={trips} onClose={() => setJournalEditor(null)} onSubmit={saveJournal} />}
      </TripDetail>
    );
  }

  return (
    <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", backgroundColor: BG, color: TEXT, minHeight: "100vh", paddingBottom: "calc(104px + env(safe-area-inset-bottom))" }}>
      <MainHero tab={tab} bucket={bucket} trips={trips} journal={journal} onLogout={logout} onOpenTrip={(t) => setOpenTripId(t.id)} />

      {errorBanner}

      <main key={tab} className="px-5 mt-6">
        {tab === "bucket" && (
          <BucketList items={bucket} onAdd={() => setBucketEditor(true)} onEdit={(i) => setBucketEditor(i)} onDelete={deleteBucket} onToggle={toggleBucketStatus} onWheel={() => setWheelOpen(true)} />
        )}
        {tab === "trips" && <Trips trips={trips} onAdd={() => setTripEditor(true)} onOpen={(t) => setOpenTripId(t.id)} />}
        {tab === "journal" && (
          <Journal entries={journal} trips={trips} onAdd={() => setJournalEditor(true)} onEdit={(e) => setJournalEditor(e)} onDelete={deleteJournal} />
        )}
        {tab === "world" && <MyWorld bucket={bucket} trips={trips} journal={journal} />}
      </main>

      <nav className="flex p-1.5 rounded-2xl"
        style={{ position: "fixed", left: 12, right: 12, bottom: "calc(12px + env(safe-area-inset-bottom))", backgroundColor: "rgba(255,255,255,0.88)", backdropFilter: "blur(14px)", WebkitBackdropFilter: "blur(14px)", border: `1px solid ${BORDER}`, boxShadow: "0 12px 30px -14px rgba(91,46,87,0.45)", zIndex: 40 }}>
        <TabButton active={tab === "bucket"} onClick={() => setTab("bucket")} icon="globe" label="Bucket list" />
        <TabButton active={tab === "trips"} onClick={() => setTab("trips")} icon="plane" label="Road trips" />
        <TabButton active={tab === "journal"} onClick={() => setTab("journal")} icon="book" label="Carnet" />
        <TabButton active={tab === "world"} onClick={() => setTab("world")} icon="map" label="Mon monde" />
      </nav>

      {bucketEditor && <BucketForm initial={typeof bucketEditor === "object" ? bucketEditor : null} onClose={() => setBucketEditor(null)} onSubmit={saveBucket} />}
      {tripEditor && <TripForm initial={typeof tripEditor === "object" ? tripEditor : null} onClose={() => setTripEditor(null)} onSubmit={saveTrip} />}
      {journalEditor && <JournalForm initial={typeof journalEditor === "object" ? journalEditor : null} trips={trips} onClose={() => setJournalEditor(null)} onSubmit={saveJournal} />}
      {wheelOpen && <DestinationWheel items={bucket} onClose={() => setWheelOpen(false)} />}
    </div>
  );
}

const TAGLINES = {
  bucket: "Où rêves-tu d'aller ?",
  trips: "Prochain embarquement…",
  journal: "Souvenirs d'ailleurs",
  world: "Ton monde, pays après pays",
};

function MainHero({ tab, bucket, trips, journal, onLogout, onOpenTrip }) {
  const [leg, setLeg] = useState(null);
  const items = useMemo(() => {
    if (tab === "bucket") {
      return [...bucket.filter((i) => i.status !== "visite"), ...bucket.filter((i) => i.status === "visite")]
        .map((i) => ({ q: [i.place, i.country].filter(Boolean).join(", "), label: i.place, sub: i.country, done: i.status === "visite" }));
    }
    if (tab === "trips") {
      return trips.flatMap((t) => {
        const done = tripStatus(t).label === "Terminé";
        const stops = t.stops || [];
        return stops.length
          ? stops.map((s) => ({ q: s.name, label: s.name, sub: t.title, done }))
          : parseCountries(t.countries).map((c) => ({ q: c, label: c, sub: t.title, done }));
      });
    }
    if (tab === "world") return allPlaces(bucket, trips, journal);
    return journal.filter((j) => j.place || j.country)
      .map((j) => ({ q: [j.place, j.country].filter(Boolean).join(", "), label: j.place || j.country, sub: j.place ? j.country : "", done: true }));
  }, [tab, bucket, trips, journal]);
  const points = useGeoPoints(items);

  const today = todayISO();
  const nextTrip = trips.filter((t) => t.start_date && t.start_date >= today).sort((a, b) => a.start_date.localeCompare(b.start_date))[0];
  const visited = bucket.filter((i) => i.status === "visite").length;

  return (
    <Sky>
      <header className="px-5" style={{ paddingTop: "calc(1.5rem + env(safe-area-inset-top))" }}>
        <div className="flex items-start justify-between">
          <div className="fade-up">
            <p className="text-[11px] tracking-[0.3em] uppercase opacity-75">Carnet de voyage</p>
            <h1 style={{ fontFamily: SERIF }} className="text-3xl mt-1 font-semibold">Mon road trip</h1>
            <p key={tab} className="caption-in text-sm mt-1 italic opacity-85" style={{ fontFamily: SERIF }}>{TAGLINES[tab]}</p>
          </div>
          <button onClick={onLogout} className="press text-[10px] mt-1 px-2.5 py-1 rounded-full shrink-0" style={{ background: "rgba(255,255,255,0.14)", border: "1px solid rgba(255,255,255,0.25)" }}>Déconnexion</button>
        </div>
      </header>

      <div className="max-w-md mx-auto">
        <Globe points={points} height={250} resetKey={tab} onLeg={setLeg} />
        <FlightCaption leg={leg} />
      </div>

      <div className="flex gap-2 px-5 pt-3 pb-6 overflow-x-auto">
        <StatChip big={bucket.length - visited} small="rêves" />
        <StatChip big={visited} small={visited > 1 ? "visités" : "visité"} />
        {nextTrip
          ? <StatChip big={countdown(nextTrip).big} small={nextTrip.title} onClick={() => onOpenTrip(nextTrip)} highlight />
          : <StatChip big={trips.length} small={trips.length > 1 ? "road trips" : "road trip"} />}
      </div>
    </Sky>
  );
}

function StatChip({ big, small, onClick, highlight }) {

    <button onClick={onClick} disabled={!onClick} className="press fade-up flex items-baseline gap-1.5 px-3 py-2 rounded-2xl shrink-0 min-w-0 max-w-[60%] text-left"
      style={{ background: highlight ? "rgba(255,214,140,0.22)" : "rgba(255,255,255,0.12)", border: `1px solid ${highlight ? "rgba(255,214,140,0.6)" : "rgba(255,255,255,0.22)"}` }}>
      <span style={{ fontFamily: MONO }} className="text-lg font-semibold leading-none">{big}</span>
      <span className="text-[11px] opacity-85 truncate">{small}</span>
    </button>

}

function TabIcon({ name, color }) {
  const p = { width: 22, height: 22, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 1.7, strokeLinecap: "round", strokeLinejoin: "round" };
  if (name === "globe") return <svg {...p}><circle cx="12" cy="12" r="9" /><ellipse cx="12" cy="12" rx="4" ry="9" /><path d="M3.5 9h17M3.5 15h17" /></svg>;

/* ---------- Roue des destinations ---------- */

function DestinationWheel({ items, onClose }) {
  const pool = useMemo(() => {
    const todo = items.filter((i) => i.status !== "visite");
    const src = (todo.length >= 2 ? todo : items).map((i) => ({ label: i.place, sub: i.country }));
    return shuffle(src.length >= 2 ? src : DEMO.map((d) => ({ label: d.label, sub: d.sub }))).slice(0, 12);
  }, []);
  const n = pool.length, seg = 360 / n, R = 130, C = 140;
  const [angle, setAngle] = useState(0);
  const [spinning, setSpinning] = useState(false);
  const [result, setResult] = useState(null);
  const confetti = useMemo(() => Array.from({ length: 22 }, (_, i) => ({
    x: Math.cos((i / 22) * Math.PI * 2) * (60 + Math.random() * 70), y: Math.sin((i / 22) * Math.PI * 2) * (40 + Math.random() * 60) - 30,
    r: Math.random() * 720 - 360, c: PALETTE[i % PALETTE.length], d: Math.random() * 120,
  })), [result]);

  const spin = () => {
    if (spinning) return;
    setResult(null);
    const idx = Math.floor(Math.random() * n);
    const jitter = (Math.random() - 0.5) * seg * 0.6;
    const target = angle - (angle % 360) + 360 * 6 + (360 - (idx + 0.5) * seg) + jitter;
    setAngle(target);
    setSpinning(true);
    setTimeout(() => { setSpinning(false); setResult(pool[idx]); }, 4700);
  };
  const pt = (a, r) => [C + r * Math.sin((a * Math.PI) / 180), C - r * Math.cos((a * Math.PI) / 180)];

  return (
    <Sheet title="La roue des destinations" onClose={onClose}>
      <div className="relative mx-auto" style={{ width: 280, height: 296 }}>
        <div className="absolute z-10" style={{ left: 129, top: -2 }}><PlaneIcon size={22} rotate={180} color={TEXT} /></div>
        <svg width="280" height="280" viewBox="0 0 280 280" style={{ marginTop: 14, transform: `rotate(${angle}deg)`, transition: spinning ? "transform 4.6s cubic-bezier(.17,.67,.12,1)" : "none" }}>
          {pool.map((p, i) => {
            const a0 = i * seg, a1 = (i + 1) * seg, [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R);
            const label = p.label.length > 13 ? p.label.slice(0, 12) + "…" : p.label;
            return (
              <g key={i}>
                <path d={`M${C} ${C} L${x0} ${y0} A${R} ${R} 0 ${seg > 180 ? 1 : 0} 1 ${x1} ${y1} Z`} fill={PALETTE[i % PALETTE.length]} stroke="#FFFFFF" strokeWidth="2" />
                <g transform={`rotate(${a0 + seg / 2 - 90} ${C} ${C})`}>
                  <text x={C + R - 12} y={C} textAnchor="end" dominantBaseline="middle" fill="#FFFFFF" fontSize="11" fontWeight="600" fontFamily="IBM Plex Sans, sans-serif">{label}</text>
                </g>
              </g>
            );
          })}
          <circle cx={C} cy={C} r="18" fill="#FFFFFF" stroke={BORDER} strokeWidth="2" />
          <circle cx={C} cy={C} r="6" fill={ROSE} />
        </svg>
      </div>
      <div className="relative text-center mt-2" style={{ minHeight: 72 }}>
        {result ? (
          <div key={result.label} className="fade-up">
            {confetti.map((c, i) => (
              <span key={i} className="absolute" style={{ left: "50%", top: 20, width: 7, height: 10, borderRadius: 2, background: c.c, "--x": `${c.x}px`, "--y": `${c.y}px`, "--r": `${c.r}deg`, animation: `confetti 1.1s ease-out ${c.d}ms both` }} />
            ))}
            <p className="text-[11px] uppercase tracking-[0.25em]" style={{ color: ROSE }}>Cap sur</p>
            <p style={{ fontFamily: SERIF }} className="text-3xl mt-1">{result.label}</p>
            {result.sub && <p className="text-xs mt-0.5" style={{ color: TEXT_MUTED }}>{result.sub}</p>}
          </div>
        ) : (
          <p className="text-sm pt-4" style={{ color: TEXT_MUTED }}>{spinning ? "Les moteurs chauffent…" : `${n} destinations dans la roue`}</p>
        )}
      </div>
      <PrimaryButton disabled={spinning} onClick={spin} className="mt-4">{result ? "Relancer la roue" : "Tourner la roue"}</PrimaryButton>
    </Sheet>
  );
}

  const glass = { background: "rgba(255,255,255,0.14)", border: "1px solid rgba(255,255,255,0.25)" };

  return (
    <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", backgroundColor: BG, color: TEXT, minHeight: "100vh", paddingBottom: "calc(2rem + env(safe-area-inset-bottom))" }}>
      <Sky>
        <header className="px-5" style={{ paddingTop: "calc(1.25rem + env(safe-area-inset-top))" }}>
          <div className="flex items-center justify-between">
            <button onClick={onBack} className="press text-xs px-3 py-1.5 rounded-full" style={glass}>‹ Retour</button>
            <div className="flex gap-2">
              <button onClick={onEditTrip} className="press w-8 h-8 rounded-full text-sm" style={glass}>✏️</button>
              <button onClick={onDeleteTrip} className="press w-8 h-8 rounded-full text-sm" style={glass}>🗑️</button>
            </div>
          </div>
          <div className="flex items-end justify-between gap-3 mt-4 fade-up">
            <div className="min-w-0">
              <h1 style={{ fontFamily: SERIF }} className="text-3xl leading-tight">{trip.title}</h1>
              <div className="flex flex-wrap items-center gap-2 mt-2 text-xs opacity-90">
                <span className="px-2 py-0.5 rounded-full" style={glass}>{st.label}</span>
                {(trip.start_date || trip.end_date) && <span>{formatShort(trip.start_date)} → {formatShort(trip.end_date)}</span>}
                {km > 0 && <span style={{ fontFamily: MONO }}>≈ {fmtNum(km)} km</span>}
              </div>
            </div>
            <div className="text-center shrink-0 px-3 py-2 rounded-2xl" style={{ background: "rgba(255,214,140,0.2)", border: "1px solid rgba(255,214,140,0.6)" }}>
              <p style={{ fontFamily: MONO }} className="text-2xl font-semibold leading-none">{cd.big}</p>
              <p className="text-[9px] uppercase tracking-wider mt-1 opacity-85">{cd.small}</p>
            </div>
          </div>
        </header>
        <div className="max-w-md mx-auto">
          <Globe points={points} mode="route" height={240} resetKey={trip.id} onLeg={setLeg} />
          {points.length > 0 ? <FlightCaption leg={leg} mode="route" /> : (
            <p className="text-center text-xs opacity-80 px-6" style={{ height: 30 }}>{stops.length || countries.length ? "Localisation des étapes…" : "Ajoute des étapes pour tracer ton itinéraire ✈"}</p>
          )}
        </div>
        {countries.length > 0 && <div className="flex flex-wrap justify-center gap-1.5 px-5 pt-2 pb-6">{countries.map((c) => <span key={c} className="text-[10px] px-2 py-0.5 rounded-full" style={glass}>{c}</span>)}</div>}
        {countries.length === 0 && <div style={{ height: 18 }} />}
      </Sky>

      {errorBanner}

      <div className="px-5 mt-5 sticky z-30" style={{ top: "calc(8px + env(safe-area-inset-top))" }}>
        <Segmented value={section} onChange={setSection} options={TRIP_TABS} />
      </div>

      <main key={section} className="px-5 mt-5 space-y-6">
        {section === "route" && (
          <>
            {trip.notes && <Card className="fade-up"><p className="text-xs leading-relaxed" style={{ color: TEXT_MUTED }}>{trip.notes}</p></Card>}
            <div>
              <SectionHeader label={km > 0 ? `${stops.length} étapes · ≈ ${fmtNum(km)} km` : "Étapes"} action="+ Étape" onAction={() => setStopEditor(true)} />
              {stops.length === 0 ? <EmptyState text="Ajoute les étapes de ton itinéraire, dans l'ordre : l'avion les reliera sur le globe." /> : (
                <div className="relative">
                  <div className="absolute" style={{ left: 15, top: 16, bottom: 16, borderLeft: `2px dashed ${ROSE_PALE}` }} />
                  {stops.map((s, idx) => {
                    const edge = idx === 0 || idx === stops.length - 1;
                    const a = idx > 0 && geoOf(stops[idx - 1].name), b = geoOf(s.name);
                    const legKm = a && b ? distKm(a, b) : null;
                    return (
                      <div key={s.id} className="fade-up relative flex items-start gap-3 mb-2" style={{ animationDelay: `${Math.min(idx, 10) * 60}ms` }}>
                        <div className="w-8 h-8 rounded-full flex items-center justify-center text-[11px] font-semibold shrink-0 mt-1.5 relative"
                          style={{ background: edge ? ROSE : SURFACE, color: edge ? "#FFFFFF" : ROSE, border: `2px solid ${ROSE}`, fontFamily: MONO }}>
                          {idx === stops.length - 1 && stops.length > 1 ? "🏁" : idx + 1}
                        </div>
                        <Card className="flex-1 min-w-0 flex items-start gap-2 !p-3">
                          <button onClick={() => setStopEditor(s)} className="flex-1 min-w-0 text-left">
                            <div className="flex items-baseline justify-between gap-2">
                              <p className="text-sm font-medium truncate">{s.name}</p>
                              {legKm !== null && <span className="text-[10px] shrink-0 px-1.5 py-0.5 rounded-full" style={{ fontFamily: MONO, background: SURFACE_ALT, color: ROSE }}>+{fmtNum(legKm)} km</span>}
                            </div>
                            {(s.arrival || s.departure) && <p className="text-[11px] mt-0.5" style={{ color: TEXT_MUTED, fontFamily: MONO }}>{formatShort(s.arrival)}{s.departure ? ` → ${formatShort(s.departure)}` : ""}</p>}
                            {s.notes && <p className="text-[11px] mt-1" style={{ color: TEXT_MUTED }}>{s.notes}</p>}
                          </button>
                          <button onClick={() => deleteStop(s.id)} style={{ color: TEXT_MUTED, fontSize: 13 }} className="press shrink-0">🗑️</button>
                        </Card>
                      </div>
                    );
                  })}
                  {km > 0 && <p className="text-[10px] mt-2 pl-11" style={{ color: TEXT_MUTED }}>Distances à vol d'oiseau entre les étapes.</p>}
                </div>
              )}
            </div>
          </>
        )}
        {section === "check" && <Checklist trip={trip} onPatch={onPatch} />}
        {section === "budget" && <TripBudget trip={trip} countries={countries} onPatch={onPatch} onEditTrip={onEditTrip} />}
        {section === "notes" && (
          <div>
            <SectionHeader label="Carnet de ce voyage" action="+ Note" onAction={onAddJournal} />
            {journal.length === 0 ? <EmptyState text="Aucune note de voyage liée pour l'instant." /> : (
              <div className="space-y-3">{journal.map((j, idx) => <JournalCard key={j.id} entry={j} delay={idx * 50} />)}</div>
            )}
          </div>
        )}
      </main>

      {stopEditor && <StopForm initial={typeof stopEditor === "object" ? stopEditor : null} onClose={() => setStopEditor(null)} onSubmit={saveStop} />}
      {children}
    </div>
  );
}

function StopForm({ initial, onClose, onSubmit }) {
  const [name, setName] = useState(initial?.name || "");
  const [arrival, setArrival] = useState(initial?.arrival || "");
  const [departure, setDeparture] = useState(initial?.departure || "");
  const [notes, setNotes] = useState(initial?.notes || "");
  return (
    <Sheet title={initial ? "Modifier l'étape" : "Nouvelle étape"} onClose={onClose}>
      <Field label="Lieu"><input className={inputClass} style={inputStyle} value={name} onChange={(e) => setName(e.target.value)} placeholder="Ex : Dubrovnik (ou Kotor, Monténégro)" /></Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Arrivée"><input type="date" className={inputClass} style={inputStyle} value={arrival} onChange={(e) => setArrival(e.target.value)} /></Field>
        <Field label="Départ"><input type="date" className={inputClass} style={inputStyle} value={departure} onChange={(e) => setDeparture(e.target.value)} /></Field>
      </div>
      <Field label="Notes (optionnel)"><textarea className={inputClass} style={{ ...inputStyle, minHeight: 70 }} value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Logement, à voir sur place, transport…" /></Field>
      <PrimaryButton disabled={!name} onClick={() => onSubmit({ id: initial?.id, name, arrival: arrival || null, departure: departure || null, notes })}>
        {initial ? "Enregistrer" : "Ajouter l'étape"}
      </PrimaryButton>
    </Sheet>
  );
}

/* ---------- Checklist avant départ ---------- */

const DEFAULT_CHECKLIST = [
  "Passeport / carte d'identité", "Visa (si nécessaire)", "Assurance voyage", "Permis de conduire international",
  "Adaptateur de prise", "Carte bancaire (prévenir la banque)", "Médicaments & trousse de secours", "eSIM / forfait à l'étranger",
];

function Checklist({ trip, onPatch }) {
  const items = trip.checklist && trip.checklist.length ? trip.checklist : DEFAULT_CHECKLIST.map((label, i) => ({ id: "d" + i, label, done: false }));
  const [newItem, setNewItem] = useState("");
  const save = (next) => onPatch({ checklist: next });
  const toggle = (id) => save(items.map((i) => (i.id === id ? { ...i, done: !i.done } : i)));
  const remove = (id) => save(items.filter((i) => i.id !== id));
  const add = () => { if (!newItem.trim()) return; save([...items, { id: uid(), label: newItem.trim(), done: false }]); setNewItem(""); };
  const done = items.filter((i) => i.done).length;
  const pct = items.length ? (done / items.length) * 100 : 0;
  const ready = items.length > 0 && done === items.length;

  return (
    <div>
      <Card className="fade-up mb-4">
        <div className="flex items-baseline justify-between mb-3">
          <p style={{ fontFamily: SERIF }} className="text-lg">{ready ? "Prêt pour le décollage !" : "Avant le départ"}</p>
          <span className="text-xs" style={{ fontFamily: MONO, color: ready ? SAGE : ROSE }}>{done}/{items.length}</span>
        </div>
        <ProgressBar pct={pct} plane color={ready ? SAGE : ROSE} />
        {ready && <p key="ok" className="pop text-xs mt-3" style={{ color: SAGE }}>Tout est coché, bon voyage ✈</p>}
      </Card>
      <div className="space-y-2">
        {items.map((i, idx) => (
          <div key={i.id} className="fade-up flex items-center gap-3 rounded-xl border px-3 py-2.5" style={{ animationDelay: `${Math.min(idx, 10) * 35}ms`, background: SURFACE, borderColor: BORDER }}>
            <button onClick={() => toggle(i.id)} className="press w-6 h-6 rounded-md flex items-center justify-center shrink-0 border"
              style={{ background: i.done ? SAGE : "transparent", borderColor: i.done ? SAGE : BORDER, transition: "background .2s" }}>
              {i.done && <span key="c" className="pop text-white text-xs">✓</span>}
            </button>
            <button onClick={() => toggle(i.id)} className="flex-1 text-left text-sm" style={{ color: i.done ? TEXT_MUTED : TEXT, textDecoration: i.done ? "line-through" : "none" }}>{i.label}</button>
            <button onClick={() => remove(i.id)} className="press text-xs shrink-0" style={{ color: TEXT_MUTED }}>✕</button>
          </div>
        ))}
      </div>
      <div className="flex gap-2 mt-3">
        <input className={inputClass} style={inputStyle} value={newItem} onChange={(e) => setNewItem(e.target.value)} onKeyDown={(e) => e.key === "Enter" && add()} placeholder="Ajouter un élément…" />
        <button onClick={add} disabled={!newItem.trim()} className="press px-4 rounded-lg text-sm font-medium disabled:opacity-40" style={{ background: ROSE, color: "#FFFFFF" }}>+</button>
      </div>
    </div>
  );
}

/* ---------- Budget du voyage ---------- */

const EXPENSE_CATS = [
  { v: "carburant", label: "⛽ Carburant", color: GOLD },
  { v: "hebergement", label: "🛏️ Hébergement", color: BLUE },
  { v: "nourriture", label: "🍜 Nourriture", color: "#CE7A52" },
  { v: "activites", label: "🎟️ Activités", color: "#9868A8" },
  { v: "transport", label: "🚆 Transport", color: "#3F8F8F" },
  { v: "imprevus", label: "⚡ Imprévus", color: DANGER },
];
const catOf = (v) => EXPENSE_CATS.find((c) => c.v === v) || EXPENSE_CATS[EXPENSE_CATS.length - 1];

function TripBudget({ trip, countries, onPatch, onEditTrip }) {
  const [editor, setEditor] = useState(null);
  const expenses = trip.expenses || [];
  const total = expenses.reduce((s, e) => s + (Number(e.amount) || 0), 0);
  const budget = Number(trip.budget) || 0;
  const over = budget > 0 && total > budget;
  const animatedTotal = useCountUp(Math.round(total));
  const byCat = EXPENSE_CATS.map((c) => ({ ...c, sum: expenses.filter((e) => catOf(e.category).v === c.v).reduce((s, e) => s + (Number(e.amount) || 0), 0) })).filter((c) => c.sum > 0).sort((a, b) => b.sum - a.sum);
  const byCountry = Object.entries(expenses.reduce((m, e) => { if (e.country) m[e.country] = (m[e.country] || 0) + (Number(e.amount) || 0); return m; }, {})).sort((a, b) => b[1] - a[1]);

  const save = (exp) => {
    const next = exp.id && expenses.some((e) => e.id === exp.id) ? expenses.map((e) => (e.id === exp.id ? exp : e)) : [...expenses, { ...exp, id: uid() }];
    onPatch({ expenses: next });
    setEditor(null);
  };
  const remove = (id) => onPatch({ expenses: expenses.filter((e) => e.id !== id) });

  return (
    <div>
      <Card className="fade-up mb-5">
        <p className="text-[11px] uppercase tracking-[0.15em]" style={{ color: TEXT_MUTED }}>Dépensé</p>
        <div className="flex items-baseline gap-2 mt-1">
          <p style={{ fontFamily: MONO, color: over ? DANGER : TEXT }} className="text-3xl font-semibold">{eur(animatedTotal)}</p>
          {budget > 0 && <p className="text-sm" style={{ color: TEXT_MUTED }}>/ {eur(budget)}</p>}
        </div>
        {budget > 0 ? (
          <>
            <div className="mt-3"><ProgressBar pct={(total / budget) * 100} color={over ? DANGER : SAGE} /></div>
            <p className="text-xs mt-2" style={{ color: over ? DANGER : SAGE }}>{over ? `Budget dépassé de ${eur(total - budget)}` : `Il reste ${eur(budget - total)}`}</p>
          </>
        ) : (
          <button onClick={onEditTrip} className="press text-xs mt-2 underline" style={{ color: ROSE }}>Définir un budget pour ce voyage</button>
        )}
      </Card>

      {byCat.length > 0 && (
        <div className="mb-5">
          <SectionHeader label="Par catégorie" />
          <Card className="space-y-3">
            {byCat.map((c) => (
              <div key={c.v}>
                <div className="flex justify-between text-xs mb-1"><span>{c.label}</span><span style={{ fontFamily: MONO }}>{eur(c.sum)}</span></div>
                <ProgressBar pct={(c.sum / total) * 100} color={c.color} height={6} />
              </div>
            ))}
          </Card>
        </div>
      )}

      {byCountry.length > 0 && (
        <div className="mb-5">
          <SectionHeader label="Par pays" />
          <div className="flex flex-wrap gap-2">
            {byCountry.map(([c, sum]) => (
              <span key={c} className="text-xs px-3 py-1.5 rounded-full" style={{ background: colorFor(c) + "1F", color: colorFor(c) }}>{c} · <b style={{ fontFamily: MONO }}>{eur(sum)}</b></span>
            ))}
          </div>
        </div>
      )}

      <SectionHeader label={`${expenses.length} dépense${expenses.length > 1 ? "s" : ""}`} action="+ Dépense" onAction={() => setEditor(true)} />
      {expenses.length === 0 ? <EmptyState text="Note tes dépenses au fil du voyage : carburant, hébergement, repas…" /> : (
        <div className="space-y-2">
          {[...expenses].sort((a, b) => (b.date || "").localeCompare(a.date || "")).map((e, idx) => {
            const c = catOf(e.category);
            return (
              <Card key={e.id} className="fade-up flex items-center gap-3 !p-3" style={{ animationDelay: `${Math.min(idx, 10) * 35}ms` }}>
                <span className="w-9 h-9 rounded-full flex items-center justify-center shrink-0 text-base" style={{ background: c.color + "1F" }}>{c.label.split(" ")[0]}</span>
                <button onClick={() => setEditor(e)} className="flex-1 min-w-0 text-left">
                  <p className="text-sm truncate">{e.label || c.label.split(" ").slice(1).join(" ")}</p>
                  <p className="text-[11px]" style={{ color: TEXT_MUTED }}>{[formatShort(e.date), e.country].filter(Boolean).join(" · ")}</p>
                </button>
                <span className="text-sm font-semibold shrink-0" style={{ fontFamily: MONO }}>{eur(e.amount)}</span>
                <button onClick={() => remove(e.id)} className="press text-xs shrink-0" style={{ color: TEXT_MUTED }}>✕</button>
              </Card>
            );
          })}
        </div>
      )}
      {editor && <ExpenseForm initial={typeof editor === "object" ? editor : null} countries={countries} onClose={() => setEditor(null)} onSubmit={save} />}
    </div>
  );
}

function ExpenseForm({ initial, countries, onClose, onSubmit }) {
  const [label, setLabel] = useState(initial?.label || "");
  const [amount, setAmount] = useState(initial?.amount ?? "");
  const [category, setCategory] = useState(initial?.category || "hebergement");
  const [country, setCountry] = useState(initial?.country || (countries.length === 1 ? countries[0] : ""));
  const [date, setDate] = useState(initial?.date || todayISO());
  return (
    <Sheet title={initial ? "Modifier la dépense" : "Nouvelle dépense"} onClose={onClose}>
      <Field label="Montant (€)"><input type="number" inputMode="decimal" min="0" step="0.01" className={inputClass} style={{ ...inputStyle, fontFamily: MONO, fontSize: 18 }} value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0" /></Field>
      <Field label="Catégorie"><ChipSelect value={category} onChange={setCategory} options={EXPENSE_CATS} /></Field>
      <Field label="Description (optionnel)"><input className={inputClass} style={inputStyle} value={label} onChange={(e) => setLabel(e.target.value)} placeholder="Ex : Plein à Split, auberge à Kotor…" /></Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Pays">
          <input list="expense-countries" className={inputClass} style={inputStyle} value={country} onChange={(e) => setCountry(e.target.value)} placeholder="Ex : Croatie" />
          <datalist id="expense-countries">{countries.map((c) => <option key={c} value={c} />)}</datalist>
        </Field>
        <Field label="Date"><input type="date" className={inputClass} style={inputStyle} value={date} onChange={(e) => setDate(e.target.value)} /></Field>
      </div>
      <PrimaryButton disabled={amount === "" || Number(amount) <= 0} onClick={() => onSubmit({ id: initial?.id, label, amount: Number(amount), category, country, date: date || null })}>
        {initial ? "Enregistrer" : "Ajouter la dépense"}
      </PrimaryButton>
    </Sheet>
  );
}

/* ---------- Journal (cartes postales "par avion") ---------- */

const AIRMAIL = `repeating-linear-gradient(135deg, ${ROSE} 0 10px, #FFFFFF 10px 18px, ${BLUE} 18px 28px, #FFFFFF 28px 36px)`;

function JournalCard({ entry, delay = 0 }) {
  const [open, setOpen] = useState(false);
  return (
    <div className="fade-up rounded-xl p-[4px]" style={{ background: AIRMAIL, animationDelay: `${delay}ms`, boxShadow: "0 8px 20px -14px rgba(91,46,87,0.6)" }}>
      <div onClick={() => setOpen(!open)} className="cursor-pointer rounded-lg p-4" style={{ background: SURFACE }}>
        <div className="flex items-center gap-2 mb-1 pr-14">
          {entry.country && <Pill color={colorFor(entry.country)}>{entry.country}</Pill>}
          {entry.entry_date && <span className="text-[11px]" style={{ color: TEXT_MUTED, fontFamily: MONO }}>{formatDate(entry.entry_date)}</span>}
        </div>
        <p style={{ fontFamily: SERIF }} className="text-base pr-14">{entry.title}</p>
        <div className="flex items-center gap-3 mt-0.5">
          {entry.place && <p className="text-[11px]" style={{ color: TEXT_MUTED }}>📍 {entry.place}</p>}
          {entry.rating ? <StarRating value={entry.rating} size={12} /> : null}
        </div>
        {open && entry.content && <p className="fade-up text-xs mt-2 leading-relaxed whitespace-pre-wrap" style={{ fontFamily: SERIF, fontStyle: "italic" }}>{entry.content}</p>}
        {!open && entry.content && <p className="text-[10px] mt-2" style={{ color: ROSE }}>Lire la suite ›</p>}
      </div>
    </div>
  );
}

function MemoryOfTheDay({ entries }) {
  const [pick, setPick] = useState(() => Math.floor(Date.now() / 86400000) % entries.length);
  const e = entries[pick % entries.length];
  if (!e) return null;
  const another = () => {
    if (entries.length < 2) return;
    let n = pick;
    while (n === pick) n = Math.floor(Math.random() * entries.length);
    setPick(n);
  };
  return (
    <div className="fade-up mb-6 rounded-2xl p-4 text-white relative overflow-hidden" style={{ background: "linear-gradient(135deg, #4A2950, #8E3F68 55%, #D9798A)", boxShadow: "0 14px 28px -18px rgba(74,41,80,0.9)" }}>
      <Stars count={14} maxY={90} />
      <div className="relative">
        <div className="flex items-center justify-between">
          <p className="text-[10px] uppercase tracking-[0.3em] opacity-80">Souvenir du jour</p>
          {entries.length > 1 && <button onClick={another} className="press text-[11px] px-2.5 py-1 rounded-full" style={{ background: "rgba(255,255,255,0.15)", border: "1px solid rgba(255,255,255,0.3)" }}>Un autre ↻</button>}
        </div>
        <div key={e.id} className="caption-in">
          <p style={{ fontFamily: SERIF }} className="text-xl mt-2 leading-snug">{e.title}</p>
          <p className="text-xs mt-1 opacity-85">{[e.place, e.country].filter(Boolean).join(", ")}{e.entry_date ? ` · ${relTime(e.entry_date)}` : ""}</p>
          {e.rating ? <div className="mt-1"><StarRating value={e.rating} size={13} /></div> : null}
          {e.content && <p className="text-xs mt-2 italic opacity-90 leading-relaxed" style={{ fontFamily: SERIF, display: "-webkit-box", WebkitLineClamp: 3, WebkitBoxOrient: "vertical", overflow: "hidden" }}>« {e.content} »</p>}
        </div>
      </div>
    </div>
  );
}

function Journal({ entries, trips, onAdd, onEdit, onDelete }) {
  return (
    <div>
      {entries.length > 0 && <MemoryOfTheDay entries={entries} />}
      <SectionHeader label={`${entries.length} note${entries.length > 1 ? "s" : ""}`} action="+ Nouvelle note" onAction={onAdd} />
      {entries.length === 0 ? <EmptyState text="Garde une trace de tes découvertes, anecdotes et impressions de voyage." /> : (
        <div className="space-y-3">
          {entries.map((e, idx) => (
            <div key={e.id} className="relative">
              <JournalCard entry={e} delay={Math.min(idx, 10) * 50} />
              <div className="absolute top-4 right-4 flex gap-2">
                <button onClick={(ev) => { ev.stopPropagation(); onEdit(e); }} className="press" style={{ color: TEXT_MUTED, fontSize: 12 }}>✏️</button>
                <button onClick={(ev) => { ev.stopPropagation(); onDelete(e.id); }} className="press" style={{ color: TEXT_MUTED, fontSize: 13 }}>🗑️</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function JournalForm({ initial, trips, onClose, onSubmit }) {
  const [title, setTitle] = useState(initial?.title || "");
  const [place, setPlace] = useState(initial?.place || "");
  const [country, setCountry] = useState(initial?.country || "");
  const [entryDate, setEntryDate] = useState(initial?.entry_date || todayISO());
  const [content, setContent] = useState(initial?.content || "");
  const [tripId, setTripId] = useState(initial?.trip_id || "");
  const [rating, setRating] = useState(initial?.rating || null);

  return (
    <Sheet title={initial?.id ? "Modifier la note" : "Nouvelle note de voyage"} onClose={onClose}>
      <Field label="Titre"><input className={inputClass} style={inputStyle} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Ex : Le marché de Marrakech" /></Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Lieu"><input className={inputClass} style={inputStyle} value={place} onChange={(e) => setPlace(e.target.value)} placeholder="Ex : Marrakech" /></Field>
        <Field label="Pays"><input className={inputClass} style={inputStyle} value={country} onChange={(e) => setCountry(e.target.value)} placeholder="Ex : Maroc" /></Field>
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Date"><input type="date" className={inputClass} style={inputStyle} value={entryDate} onChange={(e) => setEntryDate(e.target.value)} /></Field>
        <Field label="Ta note"><div className="py-2"><StarRating value={rating} onChange={setRating} size={24} /></div></Field>
      </div>
      {trips.length > 0 && (
        <Field label="Lier à un road trip (optionnel)">
          <select className={inputClass} style={inputStyle} value={tripId} onChange={(e) => setTripId(e.target.value)}>
            <option value="">Aucun</option>
            {trips.map((t) => <option key={t.id} value={t.id}>{t.title}</option>)}
          </select>
        </Field>
      )}
      <Field label="Ton récit"><textarea className={inputClass} style={{ ...inputStyle, minHeight: 120 }} value={content} onChange={(e) => setContent(e.target.value)} placeholder="Ce que tu as vu, appris, ressenti sur la culture locale…" /></Field>
      <PrimaryButton disabled={!title} onClick={() => onSubmit({ id: initial?.id, title, place, country, entry_date: entryDate || null, content, trip_id: tripId || null, rating: rating || null })}>
        {initial?.id ? "Enregistrer" : "Ajouter la note"}
      </PrimaryButton>
    </Sheet>
  );
}

/* ---------- Mon monde : carte + statistiques ---------- */

function MyWorld({ bucket, trips, journal }) {
  const items = useMemo(() => allPlaces(bucket, trips, journal), [bucket, trips, journal]);
  const points = useGeoPoints(items);
  const pending = new Set(items.filter((i) => !(geoKey(i.q) in geoCache)).map((i) => geoKey(i.q))).size;

  const stats = useMemo(() => {
    const byStatus = { visite: new Map(), en_cours: new Map(), prevu: new Map(), reve: new Map() };
    const seen = new Set();
    // Un pays prend le statut le plus fort (les points sont déjà triés)
    points.forEach((p) => { if (p.cc && !seen.has(p.cc)) { seen.add(p.cc); byStatus[p.status].set(p.cc, p.country || p.cc); } });
    const visited = byStatus.visite;
    const continents = new Set([...visited.keys()].map((cc) => CC_CONTINENT[cc]).filter(Boolean));
    const km = trips.filter((t) => ["visite", "en_cours"].includes(tripPlaceStatus(t))).reduce((s, t) => s + tripKm(t), 0);
    return { byStatus, visited, continents, km };
  }, [points, trips]);

  const nVisited = stats.visited.size;
  const pct = (nVisited / WORLD_COUNTRIES) * 100;
  const animVisited = useCountUp(nVisited);
  const [ringOn, setRingOn] = useState(false);
  useEffect(() => { const t = setTimeout(() => setRingOn(true), 120); return () => clearTimeout(t); }, []);
  const RING = 2 * Math.PI * 52;

  return (
    <div className="space-y-6">
      {pending > 0 && <p className="text-[11px] text-center" style={{ color: TEXT_MUTED }}>Localisation de {pending} lieu{pending > 1 ? "x" : ""} en cours…</p>}

      <Card className="fade-up flex items-center gap-5">
        <div className="relative shrink-0" style={{ width: 124, height: 124 }}>
          <svg width="124" height="124" viewBox="0 0 124 124" style={{ transform: "rotate(-90deg)" }}>
            <circle cx="62" cy="62" r="52" fill="none" stroke={SURFACE_ALT} strokeWidth="10" />
            <circle cx="62" cy="62" r="52" fill="none" stroke={SAGE} strokeWidth="10" strokeLinecap="round"
              strokeDasharray={RING} strokeDashoffset={ringOn ? RING * (1 - Math.max(pct, nVisited ? 1.5 : 0) / 100) : RING} style={{ transition: "stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)" }} />
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center">
            <span style={{ fontFamily: MONO }} className="text-3xl font-semibold leading-none">{animVisited}</span>
            <span className="text-[10px] mt-1" style={{ color: TEXT_MUTED }}>pays visités</span>
          </div>
        </div>
        <div className="min-w-0">
          <p style={{ fontFamily: SERIF }} className="text-xl leading-tight">{pct < 0.1 ? "Le monde t'attend" : `${pct.toFixed(1).replace(".", ",")} % du monde`}</p>
          <p className="text-xs mt-1" style={{ color: TEXT_MUTED }}>sur {WORLD_COUNTRIES} pays · encore {WORLD_COUNTRIES - nVisited} à découvrir</p>
        </div>
      </Card>

      <div className="grid grid-cols-2 gap-3">
        <StatTile label="Continents" value={stats.continents.size} suffix="/6" delay={60} />
        <StatTile label="Km parcourus" value={stats.km} hint="à vol d'oiseau, road trips faits" delay={120} />
        <StatTile label="Pays rêvés" value={stats.byStatus.reve.size + stats.byStatus.prevu.size} delay={180} />
        <StatTile label="Notes de voyage" value={journal.length} delay={240} />
      </div>

      <div>
        <SectionHeader label="Continents découverts" />
        <div className="grid grid-cols-3 gap-2">
          {Object.keys(CONTINENTS).map((c, i) => {
            const on = stats.continents.has(c);
            return (
              <div key={c} className="fade-up rounded-xl border p-2.5 text-center" style={{ animationDelay: `${i * 50}ms`, background: on ? SAGE + "14" : SURFACE, borderColor: on ? SAGE : BORDER, opacity: on ? 1 : 0.6 }}>
                <div className={on ? "pop" : ""} style={{ fontSize: 22, filter: on ? "none" : "grayscale(1)" }}>{CONTINENT_EMOJI[c]}</div>
                <p className="text-[10px] mt-1 leading-tight" style={{ color: on ? SAGE : TEXT_MUTED }}>{c}</p>
              </div>
            );
          })}
        </div>
      </div>

      <div>
        <SectionHeader label="Ma carte du monde" />
        <WorldMap points={points} stats={stats} />
      </div>

      {nVisited > 0 && (
        <div>
          <SectionHeader label="Pays visités" />
          <div className="flex flex-wrap gap-1.5">{[...stats.visited.values()].sort().map((c) => <Pill key={c} color={SAGE}>{c}</Pill>)}</div>
        </div>
      )}
    </div>
  );
}

function StatTile({ label, value, suffix = "", hint, delay = 0 }) {
  const v = useCountUp(value);
  return (
    <Card className="fade-up !p-3.5" style={{ animationDelay: `${delay}ms` }}>
      <p className="text-[10px] uppercase tracking-[0.15em]" style={{ color: TEXT_MUTED }}>{label}</p>
      <p className="mt-1"><span style={{ fontFamily: MONO }} className="text-2xl font-semibold">{fmtNum(v)}</span><span className="text-sm" style={{ color: TEXT_MUTED }}>{suffix}</span></p>
      {hint && <p className="text-[9px] mt-0.5" style={{ color: TEXT_MUTED }}>{hint}</p>}
    </Card>
  );
}

function WorldMap({ points, stats }) {
  const wrapRef = useRef(null);
  const [width, setWidth] = useState(0);
  const [world, setWorld] = useState(null);
  const [lit, setLit] = useState(false);
  const [sel, setSel] = useState(null);
  useEffect(() => { let alive = true; loadWorld().then((w) => alive && setWorld(w)); return () => { alive = false; }; }, []);
  useEffect(() => {
    const ro = new ResizeObserver(() => wrapRef.current && setWidth(wrapRef.current.clientWidth));
    ro.observe(wrapRef.current);
    return () => ro.disconnect();
  }, []);
  useEffect(() => { const t = setTimeout(() => setLit(true), 250); return () => clearTimeout(t); }, [world]);

  const height = Math.round(width * 0.5);
  const map = useMemo(() => {
    if (!world || !world.countries || !width) return null;
    const proj = d3.geoEqualEarth().fitExtent([[4, 4], [width - 4, height - 4]], { type: "Sphere" });
    const path = d3.geoPath(proj);
    const owner = new Map();
    points.forEach((p) => {
      const f = world.countries.find((c) => d3.geoContains(c, [p.lon, p.lat]));
      if (f && !owner.has(f)) owner.set(f, p);
    });
    let k = 0;
    return {
      sphere: path({ type: "Sphere" }),
      countries: world.countries.map((f, i) => {
        const p = owner.get(f);
        return { key: f.id || i, d: path(f), st: p ? p.status : null, name: p ? p.country || f.properties.name : f.properties.name, order: p ? k++ : 0 };
      }),
      pins: points.map((p) => ({ xy: proj([p.lon, p.lat]), st: p.status, key: p.q })),
    };
  }, [world, width, points]);

  return (
    <Card className="fade-up !p-3">
      <div ref={wrapRef} style={{ width: "100%" }}>
        {map ? (
          <svg width={width} height={height} style={{ display: "block" }}>
            <path d={map.sphere} fill="#FFF7F8" stroke={BORDER} />
            {map.countries.map((c) => (
              <path key={c.key} d={c.d} onClick={() => setSel(c)}
                fill={lit && c.st ? STATUS[c.st].color : "#EBDDE0"} stroke="#FFFFFF" strokeWidth="0.5"
                style={{ transition: `fill .7s ease ${c.order * 90}ms`, cursor: "pointer", opacity: sel && sel.key === c.key ? 0.75 : 1 }} />
            ))}
            {map.pins.map((p) => p.xy && (
              <circle key={p.key} cx={p.xy[0]} cy={p.xy[1]} r="1.8" fill="#FFFFFF" stroke={STATUS[p.st].color} strokeWidth="1" />
            ))}
          </svg>
        ) : <div style={{ height: height || 160 }} className="flex items-center justify-center text-xs" ><span style={{ color: TEXT_MUTED }}>Chargement de la carte…</span></div>}
      </div>
      <div className="flex flex-wrap gap-x-4 gap-y-1 mt-3 px-1">
        {Object.entries(STATUS).map(([k, s]) => (
          <span key={k} className="flex items-center gap-1.5 text-[11px]" style={{ color: TEXT_MUTED }}>
            <span className="w-2.5 h-2.5 rounded-full" style={{ background: s.color }} />{s.label} <b style={{ fontFamily: MONO, color: TEXT }}>{stats.byStatus[k].size}</b>
          </span>
        ))}
      </div>
      {sel && (
        <p key={sel.key} className="caption-in text-xs mt-2 px-1">
          <b>{sel.name}</b> · <span style={{ color: sel.st ? STATUS[sel.st].color : TEXT_MUTED }}>{sel.st ? STATUS[sel.st].label : "Pas encore dans tes plans"}</span>
        </p>
      )}
    </Card>
  );
}

/* ---------- Shared bits ---------- */

function PrimaryButton({ children, disabled, onClick, className = "" }) {
  return (
    <button disabled={disabled} onClick={onClick} className={`press w-full py-3 rounded-xl font-medium text-sm disabled:opacity-40 flex items-center justify-center gap-2 ${className}`}
      style={{ background: `linear-gradient(135deg, ${ROSE}, #E0857F)`, color: "#FFFFFF", boxShadow: "0 10px 20px -12px rgba(200,86,120,0.9)" }}>
      <span>{children}</span>
      <PlaneIcon size={14} rotate={90} />
    </button>
  );
}

function Sheet({ title, onClose, children }) {
  return (
    <div className="backdrop fixed inset-0 flex items-end z-50" style={{ background: "rgba(34,26,54,0.45)", backdropFilter: "blur(2px)" }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} className="sheet w-full rounded-t-3xl p-5 pt-3 overflow-y-auto"
        style={{ backgroundColor: SURFACE, borderTop: `1px solid ${BORDER}`, maxHeight: "88vh", paddingBottom: "calc(2rem + env(safe-area-inset-bottom))", color: TEXT }}>
        <div className="mx-auto mb-4 rounded-full" style={{ width: 40, height: 4, background: BORDER }} />
        <div className="flex items-center justify-between mb-5">
          <p style={{ fontFamily: SERIF }} className="text-xl">{title}</p>
          <button onClick={onClose} className="press" style={{ color: TEXT_MUTED, fontSize: 20 }}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}
function Field({ label, children }) {
  return <div className="mb-4"><label className="text-[11px] uppercase tracking-[0.15em] block mb-1.5" style={{ color: "#B97A8D" }}>{label}</label>{children}</div>;
}
const inputStyle = { backgroundColor: BG, border: `1px solid ${BORDER}`, color: TEXT };
const inputClass = "w-full rounded-lg px-3 py-2.5 text-sm focus:outline-none";

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
