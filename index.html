<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; overscroll-behavior-y: none; background: #FBF3F2; }
  body { font-family: 'IBM Plex Sans', sans-serif; }
  input, button, textarea, select { font-family: inherit; }
  ::-webkit-scrollbar { display: none; }

  /* ---- Animations ---- */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .fade-up { animation: fadeUp .55s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
  .sheet { animation: sheetUp .4s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
  .backdrop { animation: backdropIn .25s ease both; }
  @keyframes twinkle { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
  @keyframes drift { from { transform: translateX(-40vw); } to { transform: translateX(120vw); } }
  @keyframes stampIn { 0% { opacity: 0; transform: rotate(-14deg) scale(2.4); } 60% { opacity: 1; transform: rotate(-14deg) scale(.9); } 100% { opacity: .9; transform: rotate(-14deg) scale(1); } }
  .stamp { animation: stampIn .45s cubic-bezier(.3,1.4,.5,1) both; }
  @keyframes glide { 0% { left: 0; opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { left: calc(100% - 16px); opacity: 0; } }
  .glide { animation: glide 3.4s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .bob { animation: bob 2.4s ease-in-out infinite; }
  @keyframes dash { to { stroke-dashoffset: 22; } }
  .dash-move { animation: dash .7s linear infinite; }
  @keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .pop { animation: pop .35s cubic-bezier(.3,1.5,.5,1) both; }
  @keyframes captionIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .caption-in { animation: captionIn .5s ease both; }
  .press { transition: transform .12s ease; }
  .press:active { transform: scale(.96); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
  }
</style>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

// ====== 1) COLLE TES INFOS SUPABASE ICI (Settings > API dans ton projet) ======
const SUPABASE_URL = "https://sfcqszurrkznywjgdjkt.supabase.co";

// ================================================================================

// ---- Design tokens (même famille que les autres apps : rose pâle, sobre) ----
const BG = "#FBF3F2";
const SURFACE = "#FFFFFF";
const SURFACE_ALT = "#FCE9ED";
const BORDER = "#EAD7DA";
const TEXT = "#3B2E30";
const TEXT_MUTED = "#7A686B";
const ROSE = "#C85678";
const ROSE_PALE = "#E39FB3";
const SAGE = "#588A67";
const GOLD = "#B98A2E";
const BLUE = "#4E7FAE";
const DANGER = "#C1573D";
const SERIF = "'Fraunces', serif";
const MONO = "'IBM Plex Mono', monospace";
// Ciel du crépuscule pour les en-têtes animés
const SKY = "linear-gradient(180deg, #2B2140 0%, #4A2950 38%, #8E3F68 72%, #D9798A 100%)";
const SKY_FULL = "linear-gradient(180deg, #221A36 0%, #4A2950 35%, #9A4670 68%, #E6948F 100%)";

const PALETTE = [GOLD, SAGE, "#CE7A52", "#9868A8", BLUE, "#3F8F8F", ROSE, "#D18242", ROSE_PALE, "#9C8A8D"];
function colorFor(str) {
  if (!str) return TEXT_MUTED;
  let hash = 0;
  for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
  return PALETTE[hash % PALETTE.length];
}

const uid = () => Math.random().toString(36).slice(2, 10);
function todayISO() { return new Date().toISOString().slice(0, 10); }
function formatDate(d) { if (!d) return ""; return new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }); }
function formatShort(d) { if (!d) return ""; return new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "short" }); }
function parseCountries(str) { return (str || "").split(",").map((s) => s.trim()).filter(Boolean); }
function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
function tripStatus(trip) {
  const today = todayISO();
  if (trip.start_date && today < trip.start_date) return { label: "À venir", color: ROSE };
  if (trip.end_date && today > trip.end_date) return { label: "Terminé", color: SAGE };
  if (trip.start_date || trip.end_date) return { label: "En cours", color: GOLD };
  return { label: "Sans dates", color: TEXT_MUTED };
}
function countdown(trip) {
  const today = todayISO();
  if (trip.start_date && today < trip.start_date) {
    const n = daysBetween(today, trip.start_date);
    return { big: `J-${n}`, small: n === 1 ? "demain !" : "avant le départ" };
  }
  if (trip.start_date && (!trip.end_date || today <= trip.end_date)) return { big: `J${daysBetween(trip.start_date, today) + 1}`, small: "en voyage" };
  if (trip.end_date && today > trip.end_date) return { big: "✓", small: "souvenirs" };
  return { big: "?", small: "à dater" };
}
// Code "aéroport" façon carte d'embarquement : Dubrovnik -> DUB
function code3(s) { return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z]/g, "").slice(0, 3).toUpperCase() || "···"; }

/* ---------- Avion (même silhouette que l'icône de l'app) ---------- */

const PLANE_RIGHT = [[0, -0.5], [0.045, -0.46], [0.062, -0.38], [0.062, -0.12], [0.46, 0.09], [0.47, 0.17], [0.062, 0.05], [0.05, 0.31], [0.19, 0.4], [0.19, 0.46], [0, 0.41]];
const PLANE = [...PLANE_RIGHT, ...PLANE_RIGHT.slice(1, -1).reverse().map(([x, y]) => [-x, y])];
const PLANE_POLY = PLANE.map((p) => p.join(",")).join(" ");

function PlaneIcon({ size = 16, color = "#FFFFFF", rotate = 90, style = {} }) {
  return (
    <svg width={size} height={size} viewBox="-0.55 -0.55 1.1 1.1" style={{ transform: `rotate(${rotate}deg)`, display: "block", ...style }}>
      <polygon points={PLANE_POLY} fill={color} />
    </svg>
  );
}

/* ---------- Géocodage (OpenStreetMap / Nominatim, mis en cache sur l'appareil) ---------- */

const GEO_LS = "rt-geo-v1";
const geoCache = (() => { try { return JSON.parse(localStorage.getItem(GEO_LS) || "{}"); } catch (e) { return {}; } })();
const geoPending = {};
let geoChain = Promise.resolve();
const geoKey = (q) => q.trim().toLowerCase();

function geocode(q) {
  const k = geoKey(q);
  if (k in geoCache) return Promise.resolve(geoCache[k]);
  if (geoPending[k]) return geoPending[k];
  // Une requête à la fois, espacées d'1 s (règle d'usage de Nominatim)
  geoPending[k] = geoChain = geoChain.then(() =>
    fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=fr&q=${encodeURIComponent(q)}`)
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then((j) => {
        geoCache[k] = j && j[0] ? { lat: +j[0].lat, lon: +j[0].lon } : null;
        try { localStorage.setItem(GEO_LS, JSON.stringify(geoCache)); } catch (e) {}
        return geoCache[k];
      })
      .catch(() => null)
      .then((v) => new Promise((res) => setTimeout(() => res(v), 1100)))
  );
  return geoPending[k];
}

// items : [{ q, label, sub, done }] -> points avec lat/lon (ceux déjà trouvés)
function useGeoPoints(items) {
  const seen = new Set();
  const uniq = items.filter((i) => i.q && !seen.has(geoKey(i.q)) && seen.add(geoKey(i.q)));
  const key = uniq.map((i) => i.q + (i.done ? "✓" : "")).join("|");
  const [tick, setTick] = useState(0);
  useEffect(() => {
    let alive = true;
    uniq.forEach((i) => { if (!(geoKey(i.q) in geoCache)) geocode(i.q).then(() => alive && setTick((t) => t + 1)); });
    return () => { alive = false; };
  }, [key]);
  return useMemo(() => uniq.map((i) => { const c = geoCache[geoKey(i.q)]; return c ? { ...i, ...c } : null; }).filter(Boolean), [key, tick]);
}

/* ---------- Globe animé avec l'avion ---------- */

const DEMO = [
  { label: "Marrakech", sub: "Maroc", lat: 31.63, lon: -7.99 },
  { label: "Reykjavik", sub: "Islande", lat: 64.15, lon: -21.94 },
  { label: "New York", sub: "États-Unis", lat: 40.71, lon: -74.0 },
  { label: "Rio de Janeiro", sub: "Brésil", lat: -22.9, lon: -43.2 },
  { label: "Le Cap", sub: "Afrique du Sud", lat: -33.92, lon: 18.42 },
  { label: "Bali", sub: "Indonésie", lat: -8.4, lon: 115.19 },
  { label: "Kyoto", sub: "Japon", lat: 35.01, lon: 135.77 },
  { label: "Santorin", sub: "Grèce", lat: 36.39, lon: 25.46 },
].map((d) => ({ ...d, demo: true }));

let worldPromise = null;
function loadWorld() {
  if (!worldPromise) {
    worldPromise = fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
      .then((r) => r.json())
      .then((topo) => ({
        land: topojson.feature(topo, topo.objects.land),
        borders: topojson.mesh(topo, topo.objects.countries, (a, b) => a !== b),
      }))
      .catch(() => null);
  }
  return worldPromise;
}

const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const HOLD = 1200; // pause à l'atterrissage (ms)

function Globe({ points, mode = "tour", height = 240, resetKey = "", onLeg }) {
  const wrapRef = useRef(null);
  const canvasRef = useRef(null);
  const ptsRef = useRef(points); ptsRef.current = points;
  const onLegRef = useRef(onLeg); onLegRef.current = onLeg;
  const resetRef = useRef(resetKey); resetRef.current = resetKey;
  const [world, setWorld] = useState(null);

  useEffect(() => { let alive = true; loadWorld().then((w) => alive && setWorld(w)); return () => { alive = false; }; }, []);

  useEffect(() => {
    const canvas = canvasRef.current, wrap = wrapRef.current;
    if (!canvas || !wrap || !window.d3) return;
    const ctx = canvas.getContext("2d");
    const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const proj = d3.geoOrthographic().clipAngle(90);
    const path = d3.geoPath(proj, ctx);
    const grat = d3.geoGraticule10();
    let w = 0, dpr = 1, raf = 0, dead = false, visible = true;
    let rot = null, leg = null, lastReset = resetRef.current;

    const list = () => {
      // Itinéraire : uniquement les vraies étapes (jamais d'exemples)
      if (mode === "route") return ptsRef.current || [];
      const p = ptsRef.current && ptsRef.current.length ? ptsRef.current : DEMO;
      // Une seule destination : l'avion y va, puis propose des idées d'ailleurs
      return p.length === 1 ? [p[0], ...DEMO] : p;
    };
    const makeLeg = (from, to, idx, now, total) => {
      const dist = d3.geoDistance([from.lon, from.lat], [to.lon, to.lat]);
      leg = {
        from, to, idx, start: now,
        dur: 1500 + dist * 2600,
        alt: Math.min(0.2, 0.04 + dist * 0.09),
        interp: d3.geoInterpolate([from.lon, from.lat], [to.lon, to.lat]),
      };
      onLegRef.current && onLegRef.current({ from, to, index: idx, total });
    };
    const nextLeg = (now) => {
      const l = list();
      if (!leg) return makeLeg(l[0], l[1 % l.length], 1 % l.length, now, l.length);
      let idx = (leg.idx + 1) % l.length;
      if (l[idx].lat === leg.to.lat && l[idx].lon === leg.to.lon) idx = (idx + 1) % l.length;
      makeLeg(leg.to, l[idx], idx, now, l.length);
    };

    const draw = (now) => {
      const H = height, W = w;
      if (!W) return;
      if (resetRef.current !== lastReset) { lastReset = resetRef.current; leg = null; }
      const l = list();
      // Moins de 2 lieux : pas de vol, le globe tourne doucement (ou se pose sur l'unique étape)
      const idle = l.length < 2;
      let e = 0, pos = null, target;
      if (idle) {
        leg = null;
        target = l.length ? [-l[0].lon, -l[0].lat * 0.8] : [(rot ? rot[0] : 0) + 0.15, -25];
      } else {
        if (!leg) nextLeg(now);
        let t = (now - leg.start) / leg.dur;
        if (t > 1 + HOLD / leg.dur) { nextLeg(now); t = 0; }
        if (reduced) t = 0.5;
        e = ease(Math.min(1, Math.max(0, t)));
        pos = leg.interp(e);
        // Le globe suit l'avion en douceur
        target = [-pos[0], -pos[1] * 0.8];
      }
      if (!rot || reduced) rot = target.slice();
      else {
        const dl = ((target[0] - rot[0] + 540) % 360) - 180;
        rot[0] += dl * 0.06;
        rot[1] += (target[1] - rot[1]) * 0.06;
      }

      const cx = W / 2, cy = H / 2, r = Math.min(W, H) / 2 * 0.8;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      proj.scale(r).translate([cx, cy]).rotate(rot);
      const center = [-rot[0], -rot[1]];
      const P = (ll, alt) => {
        const p = proj(ll);
        const sx = cx + (p[0] - cx) * (1 + alt), sy = cy + (p[1] - cy) * (1 + alt);
        const front = d3.geoDistance(ll, center) < Math.PI / 2;
        return [sx, sy, front || (alt > 0 && Math.hypot(sx - cx, sy - cy) > r)];
      };

      // Halo atmosphérique
      let g = ctx.createRadialGradient(cx, cy, r * 0.92, cx, cy, r * 1.32);
      g.addColorStop(0, "rgba(255,185,210,0.5)"); g.addColorStop(1, "rgba(255,185,210,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r * 1.32, 0, Math.PI * 2); ctx.fill();
      // Océan
      g = ctx.createRadialGradient(cx - r * 0.4, cy - r * 0.4, r * 0.1, cx, cy, r * 1.05);
      g.addColorStop(0, "#5D4A8A"); g.addColorStop(1, "#1F1734");
      ctx.fillStyle = g; ctx.beginPath(); path({ type: "Sphere" }); ctx.fill();
      ctx.beginPath(); path(grat); ctx.strokeStyle = "rgba(255,255,255,0.08)"; ctx.lineWidth = 0.6; ctx.stroke();
      // Continents
      if (world) {
        ctx.beginPath(); path(world.land); ctx.fillStyle = "#F4B3C4"; ctx.fill();
        ctx.beginPath(); path(world.borders); ctx.strokeStyle = "rgba(130,55,95,0.35)"; ctx.lineWidth = 0.5; ctx.stroke();
      }
      // Ombre / lumière
      g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.45, r * 0.05, cx, cy, r);
      g.addColorStop(0, "rgba(255,255,255,0.22)"); g.addColorStop(0.5, "rgba(255,255,255,0)"); g.addColorStop(1, "rgba(25,10,45,0.5)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();

      const arc = (ip, alt, upto) => {
        ctx.beginPath();
        let pen = false;
        for (let i = 0; i <= 48; i++) {
          const s = (i / 48) * upto;
          const q = P(ip(s), Math.sin(Math.PI * s) * alt);
          if (q[2]) { pen ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); pen = true; } else pen = false;
        }
        ctx.stroke();
      };

      // Itinéraire complet (mode road trip)
      if (mode === "route" && l.length > 1) {
        ctx.setLineDash([2, 4]); ctx.lineWidth = 1.2; ctx.strokeStyle = "rgba(255,255,255,0.35)";
        for (let i = 0; i < l.length - 1; i++) {
          const a = l[i], b = l[i + 1];
          const dist = d3.geoDistance([a.lon, a.lat], [b.lon, b.lat]);
          arc(d3.geoInterpolate([a.lon, a.lat], [b.lon, b.lat]), Math.min(0.2, 0.04 + dist * 0.09), 1);
        }
        ctx.setLineDash([]);
      }

      // Épingles
      l.forEach((p) => {
        const ll = [p.lon, p.lat];
        if (d3.geoDistance(ll, center) > Math.PI / 2 * 0.97) return;
        const [x, y] = proj(ll);
        const isDest = leg ? p === leg.to : l.length === 1;
        if (isDest) {
          const k = ((now / 1000) % 1.4) / 1.4;
          ctx.beginPath(); ctx.arc(x, y, 4 + k * 14, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255,214,140,${1 - k})`; ctx.lineWidth = 1.5; ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(x, y, isDest ? 4.2 : 3, 0, Math.PI * 2);
        ctx.fillStyle = p.done ? "#9FE3B4" : "#FFD68C"; ctx.fill();
        ctx.lineWidth = 1.2; ctx.strokeStyle = "#FFFFFF"; ctx.stroke();
        if (isDest && p.label) {
          ctx.font = "600 11px 'IBM Plex Sans', sans-serif";
          ctx.fillStyle = "#FFFFFF"; ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = 4;
          ctx.fillText(p.label, x + 8, y - 6);
          ctx.shadowBlur = 0;
        }
      });

      if (idle) return;
      // Traînée de l'avion
      ctx.setLineDash([4, 5]); ctx.lineDashOffset = reduced ? 0 : -now / 40;
      ctx.lineWidth = 1.6; ctx.strokeStyle = "rgba(255,255,255,0.9)";
      arc(leg.interp, leg.alt, e);
      ctx.setLineDash([]);

      // L'avion (+ son ombre sur le globe)
      const altNow = Math.sin(Math.PI * e) * leg.alt;
      const q = P(pos, altNow);
      const e0 = Math.max(0, e - 0.01), e1 = Math.min(1, e0 + 0.01);
      const qa = P(leg.interp(e0), Math.sin(Math.PI * e0) * leg.alt), qb = P(leg.interp(e1), Math.sin(Math.PI * e1) * leg.alt);
      const angle = Math.atan2(qb[1] - qa[1], qb[0] - qa[0]) + Math.PI / 2;
      const size = r * 0.17 * (1 + altNow * 1.6);
      const drawPlane = (x, y, s, fill) => {
        ctx.save(); ctx.translate(x, y); ctx.rotate(angle); ctx.scale(s, s);
        ctx.beginPath(); PLANE.forEach(([px, py], i) => (i ? ctx.lineTo(px, py) : ctx.moveTo(px, py))); ctx.closePath();
        ctx.fillStyle = fill; ctx.fill(); ctx.restore();
      };
      if (q[2]) {
        const base = proj(pos);
        drawPlane(base[0], base[1], size * 0.8, "rgba(20,8,35,0.35)");
        ctx.shadowColor = "rgba(255,255,255,0.7)"; ctx.shadowBlur = 10;
        drawPlane(q[0], q[1], size, "#FFFFFF");
        ctx.shadowBlur = 0;
      }
    };

    const resize = () => {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = wrap.clientWidth;
      canvas.width = w * dpr; canvas.height = height * dpr;
      canvas.style.width = w + "px"; canvas.style.height = height + "px";
      if (reduced) draw(performance.now());
    };
    const frame = (now) => {
      if (dead) return;
      if (visible) draw(now);
      if (!reduced) raf = requestAnimationFrame(frame);
    };
    const ro = new ResizeObserver(resize);
    ro.observe(wrap);
    const io = new IntersectionObserver(([en]) => { visible = en.isIntersecting; });
    io.observe(wrap);
    resize();
    raf = requestAnimationFrame(frame);
    return () => { dead = true; cancelAnimationFrame(raf); ro.disconnect(); io.disconnect(); };
  }, [height, world, mode]);

  return <div ref={wrapRef} style={{ width: "100%", height }}><canvas ref={canvasRef} /></div>;
}

/* ---------- Décor : étoiles, nuages, ciel ---------- */

function Stars({ count = 40, maxY = 75 }) {
  const stars = useMemo(() => Array.from({ length: count }, () => ({
    x: Math.random() * 100, y: Math.random() * maxY, s: Math.random() * 1.8 + 0.6, d: Math.random() * 4,
  })), [count, maxY]);
  return stars.map((s, i) => (
    <span key={i} style={{ position: "absolute", left: s.x + "%", top: s.y + "%", width: s.s, height: s.s, borderRadius: 9, background: "#FFFFFF", animation: `twinkle ${2.5 + s.d}s ease-in-out ${s.d}s infinite`, pointerEvents: "none" }} />
  ));
}

function Clouds() {
  const clouds = [
    { top: "58%", w: 180, h: 36, dur: 70, delay: -10, o: 0.16 },
    { top: "76%", w: 260, h: 46, dur: 95, delay: -55, o: 0.13 },
    { top: "40%", w: 120, h: 26, dur: 60, delay: -38, o: 0.1 },
  ];
  return clouds.map((c, i) => (
    <span key={i} style={{ position: "absolute", left: 0, top: c.top, width: c.w, height: c.h, borderRadius: 999, background: "#FFFFFF", opacity: c.o, filter: "blur(14px)", animation: `drift ${c.dur}s linear ${c.delay}s infinite`, pointerEvents: "none" }} />
  ));
}

function Sky({ children, full = false, style = {} }) {
  return (
    <div className="relative overflow-hidden" style={{ background: full ? SKY_FULL : SKY, color: "#FFFFFF", ...(full ? { minHeight: "100vh" } : { borderBottomLeftRadius: 32, borderBottomRightRadius: 32 }), ...style }}>
      <Stars />
      <Clouds />
      <div className="relative">{children}</div>
    </div>
  );
}

function FlightCaption({ leg, mode = "tour" }) {
  if (!leg) return <div style={{ height: 30 }} />;
  const to = leg.to;
  const text = mode === "route"
    ? <>Étape {leg.index + 1}/{leg.total} · <b>{to.label}</b></>
    : to.demo
      ? <>Et pourquoi pas <b>{to.label}</b>{to.sub ? `, ${to.sub}` : ""} ?</>
      : <>En route vers <b>{to.label}</b>{to.sub ? ` · ${to.sub}` : ""}</>;
  return (
    <div className="flex justify-center" style={{ height: 30 }}>
      <div key={to.label + leg.index} className="caption-in flex items-center gap-2 px-3 py-1.5 rounded-full text-xs max-w-[90%]"
        style={{ background: "rgba(255,255,255,0.14)", border: "1px solid rgba(255,255,255,0.25)", backdropFilter: "blur(8px)", WebkitBackdropFilter: "blur(8px)" }}>
        <PlaneIcon size={12} rotate={90} />
        <span className="truncate">{text}</span>
      </div>
    </div>
  );
}

function Boarding({ text = "Embarquement…" }) {
  return (
    <Sky full>
      <div className="flex flex-col items-center justify-center" style={{ minHeight: "100vh" }}>
        <div className="relative" style={{ width: 220, height: 70 }}>
          <svg width="220" height="70" className="absolute inset-0">
            <path d="M10 62 Q 110 -14 210 62" fill="none" stroke="rgba(255,255,255,0.55)" strokeWidth="2" strokeDasharray="5 6" className="dash-move" />
          </svg>
          <div className="bob absolute" style={{ left: 95, top: 8 }}><PlaneIcon size={30} rotate={90} /></div>
        </div>
        <p className="mt-6 text-[11px] tracking-[0.35em] uppercase opacity-80">{text}</p>
      </div>
    </Sky>
  );
}

/* ---------- Auth ---------- */

function Root() {
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, sess) => setSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);
  if (session === undefined) return <Boarding text="Connexion…" />;
  if (!session) return <AuthScreen />;
  return <App key={session.user.id} session={session} />;
}

function AuthScreen() {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [loading, setLoading] = useState(false);
  const [leg, setLeg] = useState(null);

  const submit = async () => {
    setError(""); setInfo(""); setLoading(true);
    try {
      if (mode === "signup") {
        const { error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        setInfo("Compte créé. Si une confirmation par email est demandée, vérifie ta boîte mail, puis connecte-toi.");
        setMode("signin");
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch (e) {
      setError(e.message || "Une erreur est survenue.");
    } finally {
      setLoading(false);
    }
  };

  return (
    <Sky full>
      <div className="flex flex-col px-6" style={{ minHeight: "100vh", paddingTop: "calc(2.5rem + env(safe-area-inset-top))", paddingBottom: "calc(2rem + env(safe-area-inset-bottom))" }}>
        <div className="text-center fade-up">
          <p className="text-xs tracking-[0.3em] uppercase opacity-80">Mon road trip</p>
          <h1 style={{ fontFamily: SERIF }} className="text-4xl mt-2">{mode === "signup" ? "Le monde t'attend" : "Content de te revoir"}</h1>
        </div>
        <div className="max-w-md w-full mx-auto mt-2">
          <Globe points={[]} height={280} resetKey="auth" onLeg={setLeg} />
          <FlightCaption leg={leg} />
        </div>
        <div className="max-w-sm w-full mx-auto mt-6 rounded-3xl p-5 fade-up" style={{ animationDelay: "150ms", background: "rgba(255,255,255,0.95)", color: TEXT, boxShadow: "0 20px 50px -20px rgba(30,10,40,0.6)" }}>
          <Field label="Email"><input type="email" className={inputClass} style={inputStyle} value={email} onChange={(e) => setEmail(e.target.value)} placeholder="toi@exemple.com" /></Field>
          <Field label="Mot de passe"><input type="password" className={inputClass} style={inputStyle} value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => e.key === "Enter" && email && password && submit()} placeholder="••••••••" /></Field>
          {error && <p className="text-xs mb-3" style={{ color: DANGER }}>{error}</p>}
          {info && <p className="text-xs mb-3" style={{ color: SAGE }}>{info}</p>}
          <PrimaryButton disabled={loading || !email || !password} onClick={submit} className="mb-3">
            {loading ? "Décollage…" : mode === "signup" ? "Créer mon compte" : "Embarquer"}
          </PrimaryButton>
          <button onClick={() => { setMode(mode === "signup" ? "signin" : "signup"); setError(""); setInfo(""); }} className="w-full text-center text-xs" style={{ color: TEXT_MUTED }}>
            {mode === "signup" ? "J'ai déjà un compte" : "Pas encore de compte ? En créer un"}
          </button>
        </div>
      </div>
    </Sky>
  );
}

/* ---------- App principale ---------- */

function App({ session }) {
  const [bucket, setBucket] = useState([]);
  const [trips, setTrips] = useState([]);
  const [journal, setJournal] = useState([]);
  const [ready, setReady] = useState(false);
  const [tab, setTab] = useState("bucket");
  const [openTripId, setOpenTripId] = useState(null);
  const [bucketEditor, setBucketEditor] = useState(null);
  const [tripEditor, setTripEditor] = useState(null);
  const [journalEditor, setJournalEditor] = useState(null);
  const [error, setError] = useState("");

  const fetchAll = async () => {
    const [b, t, j] = await Promise.all([
      sb.from("bucket_list").select("*").eq("user_id", session.user.id).order("created_at", { ascending: false }),
      sb.from("trips").select("*").eq("user_id", session.user.id).order("start_date", { ascending: true, nullsFirst: false }),
      sb.from("journal_entries").select("*").eq("user_id", session.user.id).order("entry_date", { ascending: false, nullsFirst: false }),
    ]);
    if (!b.error) setBucket(b.data || []);
    if (!t.error) setTrips(t.data || []);
    if (!j.error) setJournal(j.data || []);
    setReady(true);
  };
  useEffect(() => { fetchAll(); }, [session.user.id]);
  const logout = () => sb.auth.signOut();

  // ---- bucket list ----
  const saveBucket = async (item) => {
    setError("");
    const { error } = item.id
      ? await sb.from("bucket_list").update(item).eq("id", item.id)
      : await sb.from("bucket_list").insert({ ...item, user_id: session.user.id });
    if (error) setError(error.message);
    setBucketEditor(null); fetchAll();
  };
  const deleteBucket = async (id) => { const { error } = await sb.from("bucket_list").delete().eq("id", id); if (error) setError(error.message); fetchAll(); };
  const toggleBucketStatus = async (item) => {
    const status = item.status === "visite" ? "a_visiter" : "visite";
    const { error } = await sb.from("bucket_list").update({ status }).eq("id", item.id);
    if (error) setError(error.message); fetchAll();
  };

  // ---- trips ----
  const saveTrip = async (trip) => {
    setError("");
    const payload = { ...trip, updated_at: new Date().toISOString() };
    const { error } = trip.id
      ? await sb.from("trips").update(payload).eq("id", trip.id)
      : await sb.from("trips").insert({ ...payload, user_id: session.user.id, stops: [] });
    if (error) setError(error.message);
    setTripEditor(null); fetchAll();
  };
  const deleteTrip = async (id) => { const { error } = await sb.from("trips").delete().eq("id", id); if (error) setError(error.message); setOpenTripId(null); fetchAll(); };
  const saveStops = async (tripId, stops) => {
    const { error } = await sb.from("trips").update({ stops, updated_at: new Date().toISOString() }).eq("id", tripId);
    if (error) setError(error.message); fetchAll();
  };

  // ---- journal ----
  const saveJournal = async (entry) => {
    setError("");
    const { error } = entry.id
      ? await sb.from("journal_entries").update(entry).eq("id", entry.id)
      : await sb.from("journal_entries").insert({ ...entry, user_id: session.user.id });
    if (error) setError(error.message);
    setJournalEditor(null); fetchAll();
  };
  const deleteJournal = async (id) => { const { error } = await sb.from("journal_entries").delete().eq("id", id); if (error) setError(error.message); fetchAll(); };

  const openTrip = trips.find((t) => t.id === openTripId) || null;

  if (!ready) return <Boarding text="Embarquement…" />;

  if (openTrip) {
    return (
      <TripDetail
        trip={openTrip}
        journal={journal.filter((j) => j.trip_id === openTrip.id)}
        onBack={() => setOpenTripId(null)}
        onSaveStops={(stops) => saveStops(openTrip.id, stops)}
        onEditTrip={() => setTripEditor(openTrip)}
        onDeleteTrip={() => deleteTrip(openTrip.id)}
        onAddJournal={() => setJournalEditor({ trip_id: openTrip.id })}
      >
        {tripEditor && <TripForm initial={typeof tripEditor === "object" ? tripEditor : null} onClose={() => setTripEditor(null)} onSubmit={saveTrip} />}
        {journalEditor && <JournalForm initial={typeof journalEditor === "object" ? journalEditor : null} trips={trips} onClose={() => setJournalEditor(null)} onSubmit={saveJournal} />}
      </TripDetail>
    );
  }

  return (
    <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", backgroundColor: BG, color: TEXT, minHeight: "100vh", paddingBottom: "calc(104px + env(safe-area-inset-bottom))" }}>
      <MainHero tab={tab} bucket={bucket} trips={trips} journal={journal} onLogout={logout} onOpenTrip={(t) => setOpenTripId(t.id)} />

      {error && <div className="mx-5 mt-4 text-xs px-3 py-2 rounded" style={{ backgroundColor: DANGER + "1A", border: `1px solid ${DANGER}`, color: TEXT }}>{error}</div>}

      <main key={tab} className="px-5 mt-6">
        {tab === "bucket" && (
          <BucketList items={bucket} onAdd={() => setBucketEditor(true)} onEdit={(i) => setBucketEditor(i)} onDelete={deleteBucket} onToggle={toggleBucketStatus} />
        )}
        {tab === "trips" && <Trips trips={trips} onAdd={() => setTripEditor(true)} onOpen={(t) => setOpenTripId(t.id)} />}
        {tab === "journal" && (
          <Journal entries={journal} trips={trips} onAdd={() => setJournalEditor(true)} onEdit={(e) => setJournalEditor(e)} onDelete={deleteJournal} />
        )}
      </main>

      <nav className="flex p-1.5 rounded-2xl"
        style={{ position: "fixed", left: 12, right: 12, bottom: "calc(12px + env(safe-area-inset-bottom))", backgroundColor: "rgba(255,255,255,0.88)", backdropFilter: "blur(14px)", WebkitBackdropFilter: "blur(14px)", border: `1px solid ${BORDER}`, boxShadow: "0 12px 30px -14px rgba(91,46,87,0.45)", zIndex: 40 }}>
        <TabButton active={tab === "bucket"} onClick={() => setTab("bucket")} icon="globe" label="Bucket list" />
        <TabButton active={tab === "trips"} onClick={() => setTab("trips")} icon="plane" label="Road trips" />
        <TabButton active={tab === "journal"} onClick={() => setTab("journal")} icon="book" label="Carnet" />
      </nav>

      {bucketEditor && <BucketForm initial={typeof bucketEditor === "object" ? bucketEditor : null} onClose={() => setBucketEditor(null)} onSubmit={saveBucket} />}
      {tripEditor && <TripForm initial={typeof tripEditor === "object" ? tripEditor : null} onClose={() => setTripEditor(null)} onSubmit={saveTrip} />}
      {journalEditor && <JournalForm initial={typeof journalEditor === "object" ? journalEditor : null} trips={trips} onClose={() => setJournalEditor(null)} onSubmit={saveJournal} />}
    </div>
  );
}

const TAGLINES = {
  bucket: "Où rêves-tu d'aller ?",
  trips: "Prochain embarquement…",
  journal: "Souvenirs d'ailleurs",
};

function MainHero({ tab, bucket, trips, journal, onLogout, onOpenTrip }) {
  const [leg, setLeg] = useState(null);
  const items = useMemo(() => {
    if (tab === "bucket") {
      return [...bucket.filter((i) => i.status !== "visite"), ...bucket.filter((i) => i.status === "visite")]
        .map((i) => ({ q: [i.place, i.country].filter(Boolean).join(", "), label: i.place, sub: i.country, done: i.status === "visite" }));
    }
    if (tab === "trips") {
      return trips.flatMap((t) => {
        const done = tripStatus(t).label === "Terminé";
        const stops = t.stops || [];
        return stops.length
          ? stops.map((s) => ({ q: s.name, label: s.name, sub: t.title, done }))
          : parseCountries(t.countries).map((c) => ({ q: c, label: c, sub: t.title, done }));
      });
    }
    return journal.filter((j) => j.place || j.country)
      .map((j) => ({ q: [j.place, j.country].filter(Boolean).join(", "), label: j.place || j.country, sub: j.place ? j.country : "", done: true }));
  }, [tab, bucket, trips, journal]);
  const points = useGeoPoints(items);

  const today = todayISO();
  const nextTrip = trips.filter((t) => t.start_date && t.start_date >= today).sort((a, b) => a.start_date.localeCompare(b.start_date))[0];
  const visited = bucket.filter((i) => i.status === "visite").length;

  return (
    <Sky>
      <header className="px-5" style={{ paddingTop: "calc(1.5rem + env(safe-area-inset-top))" }}>
        <div className="flex items-start justify-between">
          <div className="fade-up">
            <p className="text-[11px] tracking-[0.3em] uppercase opacity-75">Carnet de voyage</p>
            <h1 style={{ fontFamily: SERIF }} className="text-3xl mt-1 font-semibold">Mon road trip</h1>
            <p key={tab} className="caption-in text-sm mt-1 italic opacity-85" style={{ fontFamily: SERIF }}>{TAGLINES[tab]}</p>
          </div>
          <button onClick={onLogout} className="press text-[10px] mt-1 px-2.5 py-1 rounded-full shrink-0" style={{ background: "rgba(255,255,255,0.14)", border: "1px solid rgba(255,255,255,0.25)" }}>Déconnexion</button>
        </div>
      </header>

      <div className="max-w-md mx-auto">
        <Globe points={points} height={250} resetKey={tab} onLeg={setLeg} />
        <FlightCaption leg={leg} />
      </div>

      <div className="flex gap-2 px-5 pt-3 pb-6 overflow-x-auto">
        <StatChip big={bucket.length - visited} small="rêves" />
        <StatChip big={visited} small={visited > 1 ? "visités" : "visité"} />
        {nextTrip
          ? <StatChip big={countdown(nextTrip).big} small={nextTrip.title} onClick={() => onOpenTrip(nextTrip)} highlight />
          : <StatChip big={trips.length} small={trips.length > 1 ? "road trips" : "road trip"} />}
      </div>
    </Sky>
  );
}

function StatChip({ big, small, onClick, highlight }) {
  return (
    <button onClick={onClick} disabled={!onClick} className="press fade-up flex items-baseline gap-1.5 px-3 py-2 rounded-2xl shrink-0 min-w-0 max-w-[60%] text-left"
      style={{ background: highlight ? "rgba(255,214,140,0.22)" : "rgba(255,255,255,0.12)", border: `1px solid ${highlight ? "rgba(255,214,140,0.6)" : "rgba(255,255,255,0.22)"}` }}>
      <span style={{ fontFamily: MONO }} className="text-lg font-semibold leading-none">{big}</span>
      <span className="text-[11px] opacity-85 truncate">{small}</span>
    </button>
  );
}

function TabIcon({ name, color }) {
  const p = { width: 22, height: 22, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 1.7, strokeLinecap: "round", strokeLinejoin: "round" };
  if (name === "globe") return <svg {...p}><circle cx="12" cy="12" r="9" /><ellipse cx="12" cy="12" rx="4" ry="9" /><path d="M3.5 9h17M3.5 15h17" /></svg>;
  if (name === "plane") return <PlaneIcon size={22} color={color} rotate={45} />;
  return <svg {...p}><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5z" /><path d="M5 20.5A2.5 2.5 0 0 1 7.5 18H19v3H7.5" /></svg>;
}

function TabButton({ active, onClick, icon, label }) {
  return (
    <button onClick={onClick} className="press flex-1 flex flex-col items-center gap-1 py-2 rounded-xl" style={{ color: active ? ROSE : TEXT_MUTED, background: active ? ROSE + "14" : "transparent", transition: "background .25s" }}>
      <span key={String(active)} className={active ? "pop" : ""} style={{ opacity: active ? 1 : 0.75 }}><TabIcon name={icon} color={active ? ROSE : TEXT_MUTED} /></span>
      <span className="text-[10px] tracking-wide text-center leading-none font-medium">{label}</span>
    </button>
  );
}

function Card({ children, className = "", style = {}, onClick }) {
  return <div onClick={onClick} className={`rounded-xl border p-4 ${className}`} style={{ backgroundColor: SURFACE, borderColor: BORDER, boxShadow: "0 4px 14px -10px rgba(91,46,87,0.35)", ...style }}>{children}</div>;
}
function EmptyState({ text }) {
  return (
    <div className="text-center py-10 rounded-2xl border border-dashed fade-up" style={{ borderColor: BORDER }}>
      <div className="relative mx-auto mb-3" style={{ width: 120, height: 40 }}>
        <svg width="120" height="40" className="absolute inset-0">
          <path d="M6 36 Q 60 -8 114 36" fill="none" stroke={ROSE_PALE} strokeWidth="1.6" strokeDasharray="4 5" className="dash-move" />
        </svg>
        <div className="bob absolute" style={{ left: 50, top: 2 }}><PlaneIcon size={20} rotate={90} color={ROSE} /></div>
      </div>
      <p className="text-sm px-6" style={{ color: TEXT_MUTED }}>{text}</p>
    </div>
  );
}
function Pill({ children, color }) {
  return <span className="text-[10px] px-2 py-0.5 rounded-full whitespace-nowrap" style={{ backgroundColor: color + "22", color }}>{children}</span>;
}
function SectionHeader({ label, action, onAction, outline }) {
  return (
    <div className="flex items-center justify-between mb-4">
      <p className="text-[11px] uppercase tracking-[0.15em]" style={{ color: ROSE }}>{label}</p>
      <button onClick={onAction} className="press flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full font-medium"
        style={outline ? { border: `1px solid ${BORDER}`, color: TEXT } : { backgroundColor: ROSE, color: "#FFFFFF", boxShadow: "0 6px 14px -8px rgba(200,86,120,0.9)" }}>
        {action}
      </button>
    </div>
  );
}

/* ---------- Bucket list ---------- */

function BucketList({ items, onAdd, onEdit, onDelete, onToggle }) {
  const todo = items.filter((i) => i.status !== "visite");
  const done = items.filter((i) => i.status === "visite");
  return (
    <div>
      <SectionHeader label={`${todo.length} à visiter · ${done.length} visité${done.length > 1 ? "s" : ""}`} action="+ Ajouter" onAction={onAdd} />
      {items.length === 0 ? <EmptyState text="Note les pays ou endroits que tu rêves de visiter un jour : ils apparaîtront sur le globe." /> : (
        <div className="space-y-2">
          {[...todo, ...done].map((i, idx) => {
            const visited = i.status === "visite";
            return (
              <Card key={i.id} className="fade-up relative overflow-hidden flex items-center gap-3 !p-3" style={{ animationDelay: `${Math.min(idx, 10) * 45}ms` }}>
                <button onClick={() => onToggle(i)} className="press w-8 h-8 rounded-full flex items-center justify-center shrink-0 border"
                  style={{ backgroundColor: visited ? SAGE : "transparent", borderColor: visited ? SAGE : BORDER, transition: "background .25s" }}>
                  {visited ? <span key="v" className="pop text-white text-sm">✓</span> : <PlaneIcon size={14} color={ROSE_PALE} rotate={45} />}
                </button>
                <button onClick={() => onEdit(i)} className="flex-1 min-w-0 text-left">
                  {i.country && <Pill color={colorFor(i.country)}>{i.country}</Pill>}
                  <p className="text-sm mt-1" style={{ textDecoration: visited ? "line-through" : "none", color: visited ? TEXT_MUTED : TEXT }}>{i.place}</p>
                  {i.note && <p className="text-[11px] mt-0.5 truncate" style={{ color: TEXT_MUTED }}>{i.note}</p>}
                </button>
                {visited && (
                  <span className="stamp absolute pointer-events-none text-[10px] font-semibold tracking-[0.2em] px-2 py-0.5 rounded"
                    style={{ right: 44, top: "50%", marginTop: -11, color: SAGE, border: `2px double ${SAGE}`, fontFamily: MONO }}>VISITÉ</span>
                )}
                <button onClick={() => onDelete(i.id)} style={{ color: TEXT_MUTED, fontSize: 14 }} className="press shrink-0">🗑️</button>
              </Card>
            );
          })}
        </div>
      )}
    </div>
  );
}

function BucketForm({ initial, onClose, onSubmit }) {
  const [place, setPlace] = useState(initial?.place || "");
  const [country, setCountry] = useState(initial?.country || "");
  const [note, setNote] = useState(initial?.note || "");
  return (
    <Sheet title={initial ? "Modifier" : "Ajouter à la bucket list"} onClose={onClose}>
      <Field label="Endroit"><input className={inputClass} style={inputStyle} value={place} onChange={(e) => setPlace(e.target.value)} placeholder="Ex : Kyoto, Patagonie, Cap Nord…" /></Field>
      <Field label="Pays (optionnel)"><input className={inputClass} style={inputStyle} value={country} onChange={(e) => setCountry(e.target.value)} placeholder="Ex : Japon" /></Field>
      <Field label="Note (optionnel)"><textarea className={inputClass} style={{ ...inputStyle, minHeight: 70 }} value={note} onChange={(e) => setNote(e.target.value)} placeholder="Pourquoi cet endroit, quand idéalement…" /></Field>
      <PrimaryButton disabled={!place} onClick={() => onSubmit({ id: initial?.id, place, country, note, status: initial?.status || "a_visiter" })}>
        {initial ? "Enregistrer" : "Ajouter"}
      </PrimaryButton>
    </Sheet>
  );
}

/* ---------- Trips ---------- */

function Trips({ trips, onAdd, onOpen }) {
  return (
    <div>
      <SectionHeader label={`${trips.length} road trip${trips.length > 1 ? "s" : ""}`} action="+ Nouveau" onAction={onAdd} />
      {trips.length === 0 ? <EmptyState text="Planifie ton premier road trip : étapes, dates, pays traversés." /> : (
        <div className="space-y-3">
          {trips.map((t, idx) => <BoardingPass key={t.id} trip={t} onClick={() => onOpen(t)} delay={Math.min(idx, 8) * 70} />)}
        </div>
      )}
    </div>
  );
}

function BoardingPass({ trip, onClick, delay = 0 }) {
  const st = tripStatus(trip);
  const stops = trip.stops || [];
  const countries = parseCountries(trip.countries);
  const names = stops.length ? stops.map((s) => s.name) : countries;
  const from = names[0] || "Départ";
  const to = names.length > 1 ? names[names.length - 1] : "Aventure";
  const cd = countdown(trip);
  return (
    <div onClick={onClick} className="fade-up press cursor-pointer relative flex rounded-2xl overflow-hidden"
      style={{ animationDelay: `${delay}ms`, background: SURFACE, border: `1px solid ${BORDER}`, boxShadow: "0 10px 24px -16px rgba(91,46,87,0.55)" }}>
      <div className="flex-1 min-w-0 p-4">
        <div className="flex items-center justify-between gap-2 mb-3">
          <span className="text-[9px] tracking-[0.25em] uppercase truncate" style={{ color: TEXT_MUTED, fontFamily: MONO }}>Carte d'embarquement</span>
          <Pill color={st.color}>{st.label}</Pill>
        </div>
        <div className="flex items-center gap-2">
          <div className="min-w-0" style={{ maxWidth: "38%" }}>
            <p style={{ fontFamily: MONO }} className="text-2xl font-semibold leading-none">{code3(from)}</p>
            <p className="text-[10px] mt-1 truncate" style={{ color: TEXT_MUTED }}>{from}</p>
          </div>
          <div className="flex-1 relative mx-1" style={{ height: 16, marginTop: -12 }}>
            <div className="absolute left-0 right-0" style={{ top: 7, borderTop: `2px dashed ${ROSE_PALE}` }} />
            <div className="glide absolute" style={{ top: 0 }}><PlaneIcon size={16} color={ROSE} rotate={90} /></div>
          </div>
          <div className="min-w-0 text-right" style={{ maxWidth: "38%" }}>
            <p style={{ fontFamily: MONO }} className="text-2xl font-semibold leading-none">{code3(to)}</p>
            <p className="text-[10px] mt-1 truncate" style={{ color: TEXT_MUTED }}>{to}</p>
          </div>
        </div>
        <p style={{ fontFamily: SERIF }} className="text-lg mt-3 truncate">{trip.title}</p>
        {countries.length > 0 && <div className="flex flex-wrap gap-1.5 mt-2">{countries.map((c) => <Pill key={c} color={colorFor(c)}>{c}</Pill>)}</div>}
      </div>
      <div className="relative flex flex-col items-center justify-center px-2 text-center shrink-0" style={{ width: 86, borderLeft: `2px dashed ${BORDER}`, background: SURFACE_ALT }}>
        <span className="absolute rounded-full" style={{ width: 18, height: 18, background: BG, top: -9, left: -10, border: `1px solid ${BORDER}` }} />
        <span className="absolute rounded-full" style={{ width: 18, height: 18, background: BG, bottom: -9, left: -10, border: `1px solid ${BORDER}` }} />
        <p style={{ fontFamily: MONO, color: ROSE }} className="text-xl font-semibold leading-none">{cd.big}</p>
        <p className="text-[9px] uppercase tracking-wider mt-1" style={{ color: TEXT_MUTED }}>{cd.small}</p>
        {trip.start_date && <p className="text-[10px] mt-2" style={{ color: TEXT, fontFamily: MONO }}>{formatShort(trip.start_date)}</p>}
        <p className="text-[10px]" style={{ color: TEXT_MUTED }}>{stops.length} étape{stops.length > 1 ? "s" : ""}</p>
      </div>
    </div>
  );
}

function TripForm({ initial, onClose, onSubmit }) {
  const [title, setTitle] = useState(initial?.title || "");
  const [startDate, setStartDate] = useState(initial?.start_date || "");
  const [endDate, setEndDate] = useState(initial?.end_date || "");
  const [countries, setCountries] = useState(initial?.countries || "");
  const [notes, setNotes] = useState(initial?.notes || "");
  return (
    <Sheet title={initial ? "Modifier le road trip" : "Nouveau road trip"} onClose={onClose}>
      <Field label="Titre"><input className={inputClass} style={inputStyle} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Ex : Road trip Balkans" /></Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Date de départ"><input type="date" className={inputClass} style={inputStyle} value={startDate} onChange={(e) => setStartDate(e.target.value)} /></Field>
        <Field label="Date de retour"><input type="date" className={inputClass} style={inputStyle} value={endDate} onChange={(e) => setEndDate(e.target.value)} /></Field>
      </div>
      <Field label="Pays traversés (séparés par des virgules)"><input className={inputClass} style={inputStyle} value={countries} onChange={(e) => setCountries(e.target.value)} placeholder="Ex : Croatie, Monténégro, Albanie" /></Field>
      <Field label="Notes (optionnel)"><textarea className={inputClass} style={{ ...inputStyle, minHeight: 70 }} value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Idées, budget approximatif, contraintes…" /></Field>
      <PrimaryButton disabled={!title} onClick={() => onSubmit({ id: initial?.id, title, start_date: startDate || null, end_date: endDate || null, countries, notes })}>
        {initial ? "Enregistrer les modifications" : "Créer le road trip"}
      </PrimaryButton>
    </Sheet>
  );
}

function TripDetail({ trip, journal, onBack, onSaveStops, onEditTrip, onDeleteTrip, onAddJournal, children }) {
  const [stopEditor, setStopEditor] = useState(null);
  const [leg, setLeg] = useState(null);
  const stops = trip.stops || [];
  const st = tripStatus(trip);
  const countries = parseCountries(trip.countries);
  const cd = countdown(trip);
  const items = stops.length
    ? stops.map((s) => ({ q: s.name, label: s.name, sub: "" }))
    : countries.map((c) => ({ q: c, label: c, sub: "" }));
  const points = useGeoPoints(items);

  const saveStop = (stop) => {
    let next;
    if (stop.id) next = stops.map((s) => (s.id === stop.id ? stop : s));
    else next = [...stops, { ...stop, id: uid() }];
    onSaveStops(next);
    setStopEditor(null);
  };
  const deleteStop = (id) => onSaveStops(stops.filter((s) => s.id !== id));

  const glass = { background: "rgba(255,255,255,0.14)", border: "1px solid rgba(255,255,255,0.25)" };

  return (
    <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", backgroundColor: BG, color: TEXT, minHeight: "100vh", paddingBottom: "calc(2rem + env(safe-area-inset-bottom))" }}>
      <Sky>
        <header className="px-5" style={{ paddingTop: "calc(1.25rem + env(safe-area-inset-top))" }}>
          <div className="flex items-center justify-between">
            <button onClick={onBack} className="press text-xs px-3 py-1.5 rounded-full" style={glass}>‹ Retour</button>
            <div className="flex gap-2">
              <button onClick={onEditTrip} className="press w-8 h-8 rounded-full text-sm" style={glass}>✏️</button>
              <button onClick={onDeleteTrip} className="press w-8 h-8 rounded-full text-sm" style={glass}>🗑️</button>
            </div>
          </div>
          <div className="flex items-end justify-between gap-3 mt-4 fade-up">
            <div className="min-w-0">
              <h1 style={{ fontFamily: SERIF }} className="text-3xl leading-tight">{trip.title}</h1>
              <div className="flex items-center gap-2 mt-2 text-xs opacity-90">
                <span className="px-2 py-0.5 rounded-full" style={glass}>{st.label}</span>
                {(trip.start_date || trip.end_date) && <span>{formatShort(trip.start_date)} → {formatShort(trip.end_date)}</span>}
              </div>
            </div>
            <div className="text-center shrink-0 px-3 py-2 rounded-2xl" style={{ background: "rgba(255,214,140,0.2)", border: "1px solid rgba(255,214,140,0.6)" }}>
              <p style={{ fontFamily: MONO }} className="text-2xl font-semibold leading-none">{cd.big}</p>
              <p className="text-[9px] uppercase tracking-wider mt-1 opacity-85">{cd.small}</p>
            </div>
          </div>
        </header>
        <div className="max-w-md mx-auto">
          <Globe points={points} mode="route" height={240} resetKey={trip.id} onLeg={setLeg} />
          {points.length > 0 ? <FlightCaption leg={leg} mode="route" /> : (
            <p className="text-center text-xs opacity-80 px-6" style={{ height: 30 }}>{stops.length || countries.length ? "Localisation des étapes…" : "Ajoute des étapes pour tracer ton itinéraire ✈"}</p>
          )}
        </div>
        {countries.length > 0 && <div className="flex flex-wrap justify-center gap-1.5 px-5 pt-2 pb-6">{countries.map((c) => <span key={c} className="text-[10px] px-2 py-0.5 rounded-full" style={glass}>{c}</span>)}</div>}
        {countries.length === 0 && <div style={{ height: 18 }} />}
      </Sky>

      <main className="px-5 mt-6 space-y-7">
        {trip.notes && <Card className="fade-up"><p className="text-xs leading-relaxed" style={{ color: TEXT_MUTED }}>{trip.notes}</p></Card>}

        <div>
          <SectionHeader label="Itinéraire" action="+ Étape" onAction={() => setStopEditor(true)} />
          {stops.length === 0 ? <EmptyState text="Ajoute les étapes de ton itinéraire, dans l'ordre : l'avion les reliera sur le globe." /> : (
            <div className="relative">
              <div className="absolute" style={{ left: 15, top: 16, bottom: 16, borderLeft: `2px dashed ${ROSE_PALE}` }} />
              {stops.map((s, idx) => {
                const edge = idx === 0 || idx === stops.length - 1;
                return (
                  <div key={s.id} className="fade-up relative flex items-start gap-3 mb-2" style={{ animationDelay: `${Math.min(idx, 10) * 60}ms` }}>
                    <div className="w-8 h-8 rounded-full flex items-center justify-center text-[11px] font-semibold shrink-0 mt-1.5 relative"
                      style={{ background: edge ? ROSE : SURFACE, color: edge ? "#FFFFFF" : ROSE, border: `2px solid ${ROSE}`, fontFamily: MONO }}>
                      {idx === stops.length - 1 && stops.length > 1 ? "🏁" : idx + 1}
                    </div>
                    <Card className="flex-1 min-w-0 flex items-start gap-2 !p-3">
                      <button onClick={() => setStopEditor(s)} className="flex-1 min-w-0 text-left">
                        <p className="text-sm font-medium">{s.name}</p>
                        {(s.arrival || s.departure) && <p className="text-[11px] mt-0.5" style={{ color: TEXT_MUTED, fontFamily: MONO }}>{formatShort(s.arrival)}{s.departure ? ` → ${formatShort(s.departure)}` : ""}</p>}
                        {s.notes && <p className="text-[11px] mt-1" style={{ color: TEXT_MUTED }}>{s.notes}</p>}
                      </button>
                      <button onClick={() => deleteStop(s.id)} style={{ color: TEXT_MUTED, fontSize: 13 }} className="press shrink-0">🗑️</button>
                    </Card>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        <div>
          <SectionHeader label="Carnet de ce voyage" action="+ Note" onAction={onAddJournal} outline />
          {journal.length === 0 ? <EmptyState text="Aucune note de voyage liée pour l'instant." /> : (
            <div className="space-y-3">{journal.map((j, idx) => <JournalCard key={j.id} entry={j} delay={idx * 50} />)}</div>
          )}
        </div>
      </main>

      {stopEditor && <StopForm initial={typeof stopEditor === "object" ? stopEditor : null} onClose={() => setStopEditor(null)} onSubmit={saveStop} />}
      {children}
    </div>
  );
}

function StopForm({ initial, onClose, onSubmit }) {
  const [name, setName] = useState(initial?.name || "");
  const [arrival, setArrival] = useState(initial?.arrival || "");
  const [departure, setDeparture] = useState(initial?.departure || "");
  const [notes, setNotes] = useState(initial?.notes || "");
  return (
    <Sheet title={initial ? "Modifier l'étape" : "Nouvelle étape"} onClose={onClose}>
      <Field label="Lieu"><input className={inputClass} style={inputStyle} value={name} onChange={(e) => setName(e.target.value)} placeholder="Ex : Dubrovnik" /></Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Arrivée"><input type="date" className={inputClass} style={inputStyle} value={arrival} onChange={(e) => setArrival(e.target.value)} /></Field>
        <Field label="Départ"><input type="date" className={inputClass} style={inputStyle} value={departure} onChange={(e) => setDeparture(e.target.value)} /></Field>
      </div>
      <Field label="Notes (optionnel)"><textarea className={inputClass} style={{ ...inputStyle, minHeight: 70 }} value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Logement, à voir sur place, transport…" /></Field>
      <PrimaryButton disabled={!name} onClick={() => onSubmit({ id: initial?.id, name, arrival: arrival || null, departure: departure || null, notes })}>
        {initial ? "Enregistrer" : "Ajouter l'étape"}
      </PrimaryButton>
    </Sheet>
  );
}

/* ---------- Journal (cartes postales "par avion") ---------- */

const AIRMAIL = `repeating-linear-gradient(135deg, ${ROSE} 0 10px, #FFFFFF 10px 18px, ${BLUE} 18px 28px, #FFFFFF 28px 36px)`;

function JournalCard({ entry, delay = 0 }) {
  const [open, setOpen] = useState(false);
  return (
    <div className="fade-up rounded-xl p-[4px]" style={{ background: AIRMAIL, animationDelay: `${delay}ms`, boxShadow: "0 8px 20px -14px rgba(91,46,87,0.6)" }}>
      <div onClick={() => setOpen(!open)} className="cursor-pointer rounded-lg p-4" style={{ background: SURFACE }}>
        <div className="flex items-center gap-2 mb-1 pr-14">
          {entry.country && <Pill color={colorFor(entry.country)}>{entry.country}</Pill>}
          {entry.entry_date && <span className="text-[11px]" style={{ color: TEXT_MUTED, fontFamily: MONO }}>{formatDate(entry.entry_date)}</span>}
        </div>
        <p style={{ fontFamily: SERIF }} className="text-base pr-14">{entry.title}</p>
        {entry.place && <p className="text-[11px] mt-0.5" style={{ color: TEXT_MUTED }}>📍 {entry.place}</p>}
        {open && entry.content && <p className="fade-up text-xs mt-2 leading-relaxed whitespace-pre-wrap" style={{ fontFamily: SERIF, fontStyle: "italic" }}>{entry.content}</p>}
        {!open && entry.content && <p className="text-[10px] mt-2" style={{ color: ROSE }}>Lire la suite ›</p>}
      </div>
    </div>
  );
}

function Journal({ entries, trips, onAdd, onEdit, onDelete }) {
  return (
    <div>
      <SectionHeader label={`${entries.length} note${entries.length > 1 ? "s" : ""}`} action="+ Nouvelle note" onAction={onAdd} />
      {entries.length === 0 ? <EmptyState text="Garde une trace de tes découvertes, anecdotes et impressions de voyage." /> : (
        <div className="space-y-3">
          {entries.map((e, idx) => (
            <div key={e.id} className="relative">
              <JournalCard entry={e} delay={Math.min(idx, 10) * 50} />
              <div className="absolute top-4 right-4 flex gap-2">
                <button onClick={(ev) => { ev.stopPropagation(); onEdit(e); }} className="press" style={{ color: TEXT_MUTED, fontSize: 12 }}>✏️</button>
                <button onClick={(ev) => { ev.stopPropagation(); onDelete(e.id); }} className="press" style={{ color: TEXT_MUTED, fontSize: 13 }}>🗑️</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function JournalForm({ initial, trips, onClose, onSubmit }) {
  const [title, setTitle] = useState(initial?.title || "");
  const [place, setPlace] = useState(initial?.place || "");
  const [country, setCountry] = useState(initial?.country || "");
  const [entryDate, setEntryDate] = useState(initial?.entry_date || todayISO());
  const [content, setContent] = useState(initial?.content || "");
  const [tripId, setTripId] = useState(initial?.trip_id || "");

  return (
    <Sheet title={initial?.id ? "Modifier la note" : "Nouvelle note de voyage"} onClose={onClose}>
      <Field label="Titre"><input className={inputClass} style={inputStyle} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Ex : Le marché de Marrakech" /></Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Lieu"><input className={inputClass} style={inputStyle} value={place} onChange={(e) => setPlace(e.target.value)} placeholder="Ex : Marrakech" /></Field>
        <Field label="Pays"><input className={inputClass} style={inputStyle} value={country} onChange={(e) => setCountry(e.target.value)} placeholder="Ex : Maroc" /></Field>
      </div>
      <Field label="Date"><input type="date" className={inputClass} style={inputStyle} value={entryDate} onChange={(e) => setEntryDate(e.target.value)} /></Field>
      {trips.length > 0 && (
        <Field label="Lier à un road trip (optionnel)">
          <select className={inputClass} style={inputStyle} value={tripId} onChange={(e) => setTripId(e.target.value)}>
            <option value="">Aucun</option>
            {trips.map((t) => <option key={t.id} value={t.id}>{t.title}</option>)}
          </select>
        </Field>
      )}
      <Field label="Ton récit"><textarea className={inputClass} style={{ ...inputStyle, minHeight: 120 }} value={content} onChange={(e) => setContent(e.target.value)} placeholder="Ce que tu as vu, appris, ressenti sur la culture locale…" /></Field>
      <PrimaryButton disabled={!title} onClick={() => onSubmit({ id: initial?.id, title, place, country, entry_date: entryDate || null, content, trip_id: tripId || null })}>
        {initial?.id ? "Enregistrer" : "Ajouter la note"}
      </PrimaryButton>
    </Sheet>
  );
}

/* ---------- Shared bits ---------- */

function PrimaryButton({ children, disabled, onClick, className = "" }) {
  return (
    <button disabled={disabled} onClick={onClick} className={`press w-full py-3 rounded-xl font-medium text-sm disabled:opacity-40 flex items-center justify-center gap-2 ${className}`}
      style={{ background: `linear-gradient(135deg, ${ROSE}, #E0857F)`, color: "#FFFFFF", boxShadow: "0 10px 20px -12px rgba(200,86,120,0.9)" }}>
      <span>{children}</span>
      <PlaneIcon size={14} rotate={90} />
    </button>
  );
}

function Sheet({ title, onClose, children }) {
  return (
    <div className="backdrop fixed inset-0 flex items-end z-50" style={{ background: "rgba(34,26,54,0.45)", backdropFilter: "blur(2px)" }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} className="sheet w-full rounded-t-3xl p-5 pt-3 overflow-y-auto"
        style={{ backgroundColor: SURFACE, borderTop: `1px solid ${BORDER}`, maxHeight: "88vh", paddingBottom: "calc(2rem + env(safe-area-inset-bottom))" }}>
        <div className="mx-auto mb-4 rounded-full" style={{ width: 40, height: 4, background: BORDER }} />
        <div className="flex items-center justify-between mb-5">
          <p style={{ fontFamily: SERIF }} className="text-xl">{title}</p>
          <button onClick={onClose} className="press" style={{ color: TEXT_MUTED, fontSize: 20 }}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}
function Field({ label, children }) {
  return <div className="mb-4"><label className="text-[11px] uppercase tracking-[0.15em] block mb-1.5" style={{ color: "#B97A8D" }}>{label}</label>{children}</div>;
}
const inputStyle = { backgroundColor: BG, border: `1px solid ${BORDER}`, color: TEXT };
const inputClass = "w-full rounded-lg px-3 py-2.5 text-sm focus:outline-none";

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
</script>
</body>
</html>
